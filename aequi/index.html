<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aequi Picker · Kaleidohedra</title>
<meta name="description" content="DICTO's Aequi: 1232 fair dice whose faces all have the same chance, each with its own name. Pick a die, number its faces (plain, opposites, spin-down or balanced), or make one fair, and save it as an STL to print.">
<link rel="icon" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #f5f3ee; --surface: #ffffff; --surface-2: #efece5; --text: #1c1e22; --muted: #5c626a;
  --line: #d8d3c9; --accent: #2e5c8a; --accent-text: #ffffff; --view-bg: #e9e6df; --ok: #2f7d3c; --ok-text: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141619; --surface: #1e2125; --surface-2: #272b30; --text: #ebe9e3; --muted: #a2a8af;
    --line: #363a40; --accent: #8db5df; --accent-text: #10161d; --view-bg: #1a1d21; --ok: #6cc17a; --ok-text: #0d1a10;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141619; --surface: #1e2125; --surface-2: #272b30; --text: #ebe9e3; --muted: #a2a8af;
  --line: #363a40; --accent: #8db5df; --accent-text: #10161d; --view-bg: #1a1d21; --ok: #6cc17a; --ok-text: #0d1a10;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 100vw; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tabs button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; font-size: 15px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.mark { position: fixed; right: 10px; bottom: 6px; font-size: 10px; letter-spacing: .18em; color: var(--muted); opacity: .8; pointer-events: none; z-index: 5; }
.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.view { position: relative; flex: 1 1 58%; min-height: 200px; background: var(--view-bg); touch-action: none; overflow: hidden; }
.view canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 12px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.panel { flex: 0 1 auto; max-height: 26vh; overflow-y: auto; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }
@media (orientation: landscape) and (min-width: 700px) {
  .stage { flex-direction: row; }
  .view { flex: 1 1 60%; }
  .panel { flex: 0 0 38%; max-width: 440px; max-height: none; border-top: none; border-left: 1px solid var(--line); }
}
.dock { flex: 0 0 auto; max-height: 40vh; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.05); }
.dock[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, .btn, .seg button { min-height: 48px; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
select { padding-right: 10px; min-width: 120px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn[hidden] { display: none; }
.scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
.ticks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.tick { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; user-select: none; -webkit-user-select: none; }
.tick input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); flex: 0 0 auto; }
.tick.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tick .t { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.tech { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.sw { width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.25); }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); text-align: left; font: inherit; color: var(--text); width: 100%; }
.item.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.item .sws { display: flex; gap: 3px; flex: 0 0 auto; }
.item .sw { width: 12px; height: 12px; }
.item .meta { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: flex; flex-direction: column; line-height: 1.25; }
.item .nm .tech { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.numrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 4px 0 8px; }
.numrow .seg { flex-wrap: wrap; }
.numrow .seg button { min-height: 44px; font-size: 15px; padding: 0 12px; }
.sec { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 2px 2px; }
h2 { font-size: 18px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.msg { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: 15px; }
.msg .btn { margin-top: 8px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0 10px; font-size: 15px; }
dt { color: var(--muted); }
dd { margin: 0; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-size: 13px; margin-right: 6px; }
table.kinds { border-collapse: collapse; width: 100%; font-size: 14px; }
table.kinds td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
table.kinds td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
/* Make it fair */
.sliderbox { position: relative; flex: 1 1 260px; min-width: 0; padding-top: 18px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; background: transparent; margin: 0; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: var(--line); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); margin-top: -15px; border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
input[type=range]::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
.fairmark { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--ok); background: none; border: none; padding: 0 6px; min-height: 44px; font-weight: 600; }
.fairmark::after { content: ""; width: 3px; height: 30px; background: var(--ok); border-radius: 2px; margin-top: 1px; }
.muval { font-variant-numeric: tabular-nums; min-width: 112px; font-size: 17px; }
.bars { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; }
.track { grid-column: 1 / 3; position: relative; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .06s linear; }
.fairline { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 2px; background: var(--text); opacity: .7; }
.light { display: inline-block; padding: 4px 14px; border-radius: 16px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.light.on { background: var(--ok); color: var(--ok-text); border-color: var(--ok); }
.err { color: #c0392b; }
input.cpick { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; flex: 0 0 auto; }
.toast { font-size: 13px; color: var(--muted); }
.rollout { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(30,40,60,0.88); color: #fff; padding: 8px 16px; border-radius: 18px; font-size: 16px; pointer-events: none; }
.back { text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; font-size: 15px; white-space: nowrap; }
.back:hover { background: var(--view-bg); }
</style>
</head>
<body>

<div id="app">
  <header>
    <a class="back" href="/" title="Back to the Kaleidohedra app">&#8592; Kaleidohedra</a>
    <h1>Aequi picker</h1>
    <div class="tabs" role="tablist">
      <button id="tabPick" role="tab" aria-selected="true">Pick a die</button>
      <button id="tabFair" role="tab" aria-selected="false">Make it fair</button>
    </div>
  </header>
  <main class="stage">
    <div class="view" id="view"><div class="hint">drag to turn · pinch to zoom</div><div id="rollOut" class="rollout" hidden></div></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <footer class="dock" id="dockPick">
    <div class="row">
      <select id="groupSel" aria-label="Symmetry group"></select>
      <div class="seg" role="group" aria-label="Mode">
        <button id="modeTick" aria-pressed="true">Tick faces</button>
        <button id="modeList" aria-pressed="false">List</button>
      </div>
      <button class="btn" id="vacBtn" aria-pressed="false">Vacuus</button>
      <button class="btn" id="resBtn" aria-pressed="false">Resonus</button>
      <button class="btn" id="handBtn" aria-pressed="false" hidden>Other hand</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn" id="rollBtn" title="Roll this die: every face equally likely">Roll</button>
      <button class="btn" id="stlBtn" hidden>3D print</button>
    </div>
    <div class="scroll" id="choices"></div>
  </footer>
  <footer class="dock" id="dockFair" hidden>
    <div class="row">
      <select id="lineSel" aria-label="Axis line"></select>
      <button class="btn" id="snapBtn">Snap to fair</button>
      <button class="btn" id="vacBtn2" aria-pressed="false">Vacuus</button>
      <button class="btn" id="resBtn2" aria-pressed="false">Resonus</button>
      <button class="btn" id="stlBtn2" hidden>3D print</button>
    </div>
    <div class="row">
      <span class="muval" id="muVal">μ = 1</span>
      <div class="sliderbox">
        <button class="fairmark" id="fairMark" aria-label="Snap to the fair value">fair</button>
        <input type="range" id="muSlider" min="0" max="1" step="any" aria-label="μ, the B faces' distance">
      </div>
    </div>
  </footer>
  <div class="mark">DICTO · <a href="/" style="color:inherit">Kaleidohedra</a> · <a href="https://doi.org/10.5281/zenodo.24383314" style="color:inherit">paper</a></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="/aequi/geom.js"></script>
<script>
(function () {
'use strict';
var G = window.AequiGeom;
var $ = function (id) { return document.getElementById(id); };
// app colours, only for the solid each face family stands for; neutrals for the rhombic solids
var COL = { C: '#488e48', O: '#e8c852', T: '#cd3e28', D: '#8a5cc4', I: '#3a70cd', RD: '#b3a489', RT: '#8e9aa5' };
var SOLID = { C: 'cube', O: 'octahedron', T: 'tetrahedron', D: 'dodecahedron', I: 'icosahedron', RD: 'rhombic dodecahedron', RT: 'triacontahedron' };
var SLATE = '#5e6e7f', SAND = '#e8dcc0', EDGE = 0x15181c;
function mix(a, b, t) {
  var p = function (h, i) { return parseInt(h.substr(1 + 2 * i, 2), 16); };
  return '#' + [0, 1, 2].map(function (i) { return Math.round(p(a, i) * (1 - t) + p(b, i) * t).toString(16).padStart(2, '0'); }).join('');
}
var custom = {};
try { custom = JSON.parse(localStorage.getItem('aequiColours') || '{}') || {}; } catch (e) { custom = {}; }
function colOf(key) { if (custom[key]) return custom[key]; var base = COL[key.replace('2', '')]; return /2$/.test(key) ? mix(base, '#ffffff', 0.45) : base; }
function setColour(key, val) { custom[key] = val; try { localStorage.setItem('aequiColours', JSON.stringify(custom)); } catch (e) {} if (tab === 'pick') { renderChoices(); updatePick(); } else updateFair(true); }
function resetColours() { custom = {}; try { localStorage.removeItem('aequiColours'); } catch (e) {} if (tab === 'pick') { renderChoices(); updatePick(); } else updateFair(true); }
function picker(key) { return '<input type="color" class="cpick" data-key="' + key + '" value="' + colOf(key) + '" aria-label="Colour for these faces">'; }
function wirePickers(root) { root.querySelectorAll('input.cpick').forEach(function (c) { c.oninput = function () { setColour(c.dataset.key, c.value); }; }); var r = root.querySelector('#resetCol'); if (r) r.onclick = resetColours; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---------------- viewer
var view = $('view');
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
view.insertBefore(renderer.domElement, view.firstChild);
var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 5.2); scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x50555c, 0.62));
var key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(2.5, 3, 4); camera.add(key);
var holder = new THREE.Group(); scene.add(holder);
var CUR = null, rolling = false;
holder.quaternion.setFromEuler(new THREE.Euler(-0.42, 0.62, 0.08));
var content = null, dirty = true;
function themeBg() { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--view-bg').trim() || '#e9e6df'); dirty = true; }
themeBg();
if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', themeBg) : mq.addListener(themeBg)); }
function resize() {
  var w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.z = (w < h ? 5.2 * Math.max(1, h / w * 0.82) : 5.2) * zoom; camera.updateProjectionMatrix(); dirty = true;
}
var zoom = 1;
new ResizeObserver(resize).observe(view);
function dispose(o) { o.traverse(function (c) { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); }); }
function setContent(obj) { if (content) { holder.remove(content); dispose(content); } content = obj; if (obj) holder.add(obj); dirty = true; }
(function loop() { if (dirty) { renderer.render(scene, camera); dirty = false; } requestAnimationFrame(loop); })();
// touch: one finger turns, two fingers pinch
var pts = {}, lastPinch = 0;
view.addEventListener('pointerdown', function (e) { view.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; });
view.addEventListener('pointermove', function (e) {
  if (!pts[e.pointerId]) return;
  var ids = Object.keys(pts), p = pts[e.pointerId], dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (ids.length === 1) {
    var ang = Math.sqrt(dx * dx + dy * dy) * 0.009;
    if (ang > 0) {
      var q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(dy, dx, 0).normalize(), ang);
      holder.quaternion.premultiply(q); dirty = true;
    }
    p.x = e.clientX; p.y = e.clientY;
  } else if (ids.length >= 2) {
    p.x = e.clientX; p.y = e.clientY;
    var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) { zoom = Math.min(3, Math.max(0.45, zoom * lastPinch / d)); resize(); }
    lastPinch = d;
  }
});
function up(e) { delete pts[e.pointerId]; if (Object.keys(pts).length < 2) lastPinch = 0; }
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', function (e) { e.preventDefault(); zoom = Math.min(3, Math.max(0.45, zoom * Math.exp(e.deltaY * 0.001))); resize(); }, { passive: false });

function radius(S) { var r = 0; S.verts.forEach(function (v) { r = Math.max(r, Math.hypot(v[0], v[1], v[2])); }); return r; }
function solidObject(S, colours, mirror) {
  var grp = new THREE.Group(), pos = [], col = [], c = new THREE.Color();
  S.faces.forEach(function (f) {
    c.set(colours[f.k]);
    for (var t = 1; t + 1 < f.v.length; t++) [f.v[0], f.v[t], f.v[t + 1]].forEach(function (i) { pos.push.apply(pos, S.verts[i]); col.push(c.r, c.g, c.b); });
  });
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  grp.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 18, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
  grp.add(edgeLines(S, S.edges.map(function (e) { return [S.verts[e[0]], S.verts[e[1]]]; })));
  var s = 1 / radius(S); grp.scale.set(mirror ? -s : s, s, s);
  return grp;
}
function edgeLines(S, segs) {
  var pos = []; segs.forEach(function (sg) { pos.push.apply(pos, sg[0]); pos.push.apply(pos, sg[1]); });
  var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: EDGE }));
}
function vacuusObject(S, plates, mirror) {
  var grp = new THREE.Group(), pos = [], col = [], cs = new THREE.Color(SLATE), cm = new THREE.Color(SAND), O = [0, 0, 0];
  plates.forEach(function (p) {   // one plate = one plane; its edge triangles share its colour. A plane that is also a Resonus plate is
    if (p.both && st.res) return;  // drawn once, by the Resonus (striped there), when both are on show
    if (p.both) { grp.add(stripedMesh(S, p.edges.map(function (e) { return [O, S.verts[e[0]], S.verts[e[1]]]; }), p.n, p.mirror ? SAND : SLATE, '#8f969e', 1)); return; }
    var c = p.mirror ? cm : cs;
    p.edges.forEach(function (e) { [O, S.verts[e[0]], S.verts[e[1]]].forEach(function (v) { pos.push.apply(pos, v); col.push(c.r, c.g, c.b); }); });
  });
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  grp.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 10, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
  var segs = S.edges.map(function (e) { return [S.verts[e[0]], S.verts[e[1]]]; }).concat(S.verts.map(function (v) { return [O, v]; }));
  grp.add(edgeLines(S, segs));
  var s = 1 / radius(S); grp.scale.set(mirror ? -s : s, s, s);
  return grp;
}
function polyCounts(S, k) {
  var cnt = {}; S.faces.forEach(function (f) { if (f.k === k) cnt[f.v.length] = (cnt[f.v.length] || 0) + 1; });
  return Object.keys(cnt).sort(function (a, b) { return a - b; }).map(function (n) { return cnt[n] + '×' + n + '-gon'; }).join(', ');
}

// ---------------- tabs
var tab = 'pick';
function setTab(t) {
  tab = t; $('tabPick').setAttribute('aria-selected', t === 'pick'); $('tabFair').setAttribute('aria-selected', t === 'fair');
  $('dockPick').hidden = t !== 'pick'; $('dockFair').hidden = t !== 'fair';
  resize();
  if (t === 'pick') updatePick(); else { placeMark(); updateFair(true); }
}
$('tabPick').onclick = function () { setTab('pick'); };
$('tabFair').onclick = function () { setTab('fair'); };

// ---------------- Pick a die
var data = null, fair = null;
var st = { g: null, ticked: [], mode: 'tick', vac: false, res: false, hand: false, num: 'off' };
var NAMES = null, NUMS = null;   // approved names (names.json); face numbers of the finished dice (numberings.json)
function nameOf(e) { return NAMES ? NAMES[e.k] : dieTitle(e); }

        : esc(dieTitle(e)) + ' in another position (its mirror image is the same die)';
      html += '<div class="msg">This set of faces is ' + how + '. It is shown here as you ticked it.' +
        '<br><button class="btn" id="goLarger">Show the listed form</button></div>';
    }
  } else {
    var one = G.singleOrbit(data, st.g, t);
    planes = [];
    t.forEach(function (oi, j) { orbs[oi].dirs.forEach(function (d) { planes.push({ n: data.dirs[d], d: 1, k: j }); }); });
    colours = t.map(function (oi) { return colOf(orbs[oi].col); });
    if (one) {
      html += '<div class="msg">One kind of face: under its full symmetry <b>' + one.g + '</b> these faces form a single family (' + esc(one.plain) + '), so every face is alike and the solid is fair by symmetry alone. The Aequi have two or more kinds of face.</div>';
    } else {
      var fs = G.fairSolve(planes, t.length);   // solve for the fair die here (Theorem A: at most one)
      if (fs.ok) {
        planes = fs.P;
        var num = G.dieNumber(data, st.g, t), pm = G.poem(num.n);
        html += '<div class="msg"><b>' + esc(G.dieName(num.n)) + '</b>' + (num.g !== st.g ? ' (its full symmetry is ' + num.g + ')' : '') +
          (pm ? ' · ' + esc(pm.form) + ': <i>' + pm.lines.map(esc).join(' / ') + '</i>' : '') +
          '<br>One of ours by the numbering rule (every set of kinds has its fixed number); computed here, not yet certified. Depths ' +
          fs.depths.map(function (d) { return d.toFixed(9); }).join(' : ') + '; every face within ' + fs.err.toExponential(0) + ' of 4π/' + planes.length + '.</div>';
      } else {
        var num0 = G.dieNumber(data, st.g, t);
        html += '<div class="msg">No. ' + num0.n + ': these faces cannot make a fair die: as the depths are adjusted, one kind of face disappears before the chances can be made equal.</div>';
      }
    }
  }
  S = G.buildSolid(planes); CUR = { S: S, e: e, mirror: !!(e && e.h && st.hand) };
  var N = e ? e.N : planes.length;
  console.assert(S.faces.length === N, 'face count ' + S.faces.length + ' differs from N = ' + N);
  if (e) console.assert(S.verts.length === e.c, 'corner count ' + S.verts.length + ' differs from ' + e.c);
  var mirrorShow = !!(e && e.h && st.hand);
  var plates = show(S, colours, mirrorShow);
  var nk = e && !st.vac && !st.res ? numScheme(e) : 'off';
  if (nk !== 'off') {   // the numbers sit beside the solid (not inside its mirrored scale, so they never read backwards)
    var both = new THREE.Group(); holder.remove(content); both.add(content); both.add(labelGroup(S, numbersFor(e, nk), colours, mirrorShow));
    content = both; holder.add(both); dirty = true;
  }
  if (e) {
    if (e.h) { $('handBtn').hidden = false; $('handBtn').setAttribute('aria-pressed', st.hand); }
    var kinds = e.o.map(function (oi, j) {
      var o = data.groups[e.g][oi];
      return '<tr><td>' + picker(o.col) + '</td><td>' + esc(o.plain) + '<br><span class="tech">' + esc(o.lab) + '</span></td><td class="num">' + polyCounts(S, j) + '</td><td class="num">' + e.d[j].toFixed(12) + '</td></tr>';
    }).join('');
    html += '<h2>' + esc(nameOf(e)) + '</h2>' +
      '<p class="sub">' + esc(dieTitle(e)) + ' · ' + (e.s === 'A' ? 'Main catalogue' + (e.book ? ' · book atom ' + esc(e.book) : '') : e.s === 'C' ? 'Catalogue 2, certified 24 November 2026' : e.s === 'P' ? 'Duals of the three permutahedra' : 'Both icosahedron placements') + '</p><p class="tags">' + tagsOf(e).map(esc).join(' · ') + '</p>' + numRow(e) +
      (e.m >= 4 ? '<span class="badge">Aequus Mosaicus</span>' : '') + (e.h ? '<span class="badge">two hands</span>' : '') +
      '<dl><dt>group</dt><dd>' + e.g + '</dd><dt>kinds of face m</dt><dd>' + e.m + '</dd><dt>faces N</dt><dd>' + e.N + ' (built: ' + S.faces.length + ')</dd><dt>corners</dt><dd>' + S.verts.length + '</dd>' +
      '<dt>hands</dt><dd>' + (e.h ? 'two hands (chiral)' + (st.hand ? ' · showing the other hand' : '') : 'one (mirror-symmetric)') + '</dd></dl>' +
      '<table class="kinds"><tr><td></td><td class="tech">faces by kind</td><td class="num tech">faces</td><td class="num tech">depth</td></tr>' + kinds + '</table>' +
      '<p class="note">Depths: distance of each kind of face from the centre, the first kind at 1. Every face takes 1/N of the view from the centre. Tap a colour square to change that kind\'s colour <button class="btn" id="resetCol" style="min-height:36px;margin-left:6px">Reset colours</button></p>';
  } else {
    html += '<p class="sub">' + S.faces.length + ' faces, all at depth 1.</p>';
  }
  if (S.faces.length !== N) html += '<p class="err">Check failed: built ' + S.faces.length + ' faces, expected ' + N + '.</p>';
  html += vacNote(plates);
  panel.innerHTML = html; wirePickers(panel);
  cur = { S: S, name: e ? (hasName(e) ? e.name.replace(/^Aequus /, 'Aequus-') : e.g + '-' + e.o.map(function (oi) { return data.groups[e.g][oi].lab; }).join('-')) : 'solid', mirror: mirrorShow };
  $('stlBtn').hidden = !canSave;
  var go = $('goLarger');
  if (go) go.onclick = function () { setGroup(e.g, e.o); };
  panel.querySelectorAll('#numSeg button').forEach(function (b) { b.onclick = function () { st.num = b.dataset.k; updatePick(); }; });
}

// ---------------- Make it fair
var fs = { li: 1, mu: 1, lo: 0, hi: 2, S: null };
function fairPlanes(L, mu) {
  return L.A.dirs.map(function (d) { return { n: fair.dirs[d], d: 1, k: 0 }; }).concat(L.B.dirs.map(function (d) { return { n: fair.dirs[d], d: mu, k: 1 }; }));
}
function present(L, mu) { return G.buildSolid(fairPlanes(L, mu)).faces.length === L.N; }
function bound(L, from, to) { // last mu from 'from' toward 'to' with every face present
  if (present(L, to)) return to;
  var a = from, b = to;
  for (var i = 0; i < 40; i++) { var m = (a + b) / 2; if (present(L, m)) a = m; else b = m; }
  return a;
}
function fillLines() {
  var sel = $('lineSel');
  fair.lines.forEach(function (L, i) { var o = document.createElement('option'); o.value = i; o.textContent = L.line + ' · Aequus ' + L.name; sel.appendChild(o); });
  sel.value = fs.li;
  sel.onchange = function () { setLine(+sel.value); };
  var sl = $('muSlider');
  sl.oninput = function () { setMu(+sl.value, true); };
  $('snapBtn').onclick = function () { setMu(fair.lines[fs.li].mu, false); };
  $('fairMark').onclick = $('snapBtn').onclick;
}
function setLine(i) {
  var L = fair.lines[i]; fs.li = i;
  fs.lo = bound(L, L.mu, 0.25); fs.hi = bound(L, L.mu, 4);
  var pad = (fs.hi - fs.lo) * 0.004; fs.lo += pad; fs.hi -= pad;
  var sl = $('muSlider'); sl.min = fs.lo; sl.max = fs.hi;
  setMu(L.mu, false); if (tab === 'fair') placeMark();
}
function placeMark() {
  var L = fair.lines[fs.li], sl = $('muSlider'), w = sl.clientWidth, thumb = 40;
  var x = thumb / 2 + (L.mu - fs.lo) / (fs.hi - fs.lo) * (w - thumb);
  $('fairMark').style.left = x + 'px';
}
window.addEventListener('resize', function () { if (fair) placeMark(); });
function setMu(mu, fromSlider) {
  var L = fair.lines[fs.li], tol = (fs.hi - fs.lo) * 0.006;
  if (fromSlider && Math.abs(mu - L.mu) < tol) mu = L.mu;   // the fair value holds the slider when it is close
  fs.mu = mu; if (!fromSlider || mu === L.mu) $('muSlider').value = mu;
  if (tab === 'fair') updateFair(true);
}
function updateFair(rebuild) {
  if (!fair || tab !== 'fair') return;
  var L = fair.lines[fs.li], mu = fs.mu;
  var S = G.buildSolid(fairPlanes(L, mu));
  var colours = [colOf(L.A.col), colOf(L.B.col)];
  var plates = show(S, colours, false);
  var sum = [0, 0], cnt = [0, 0];
  S.faces.forEach(function (f) { sum[f.k] += G.faceSolidAngle(S, f) / (4 * Math.PI); cnt[f.k]++; });
  var share = [cnt[0] ? sum[0] / cnt[0] : 0, cnt[1] ? sum[1] / cnt[1] : 0], fairShare = 1 / L.N;
  var isFair = mu === L.mu;
  var bar = function (j, fam) {
    var w = Math.min(100, share[j] / (2 * fairShare) * 100);
    return '<div class="bar"><span>' + picker(fam.col) + ' each of the ' + cnt[j] + ' ' + SOLID[fam.col] + ' faces</span>' +
      '<span class="num">' + (share[j] * 100).toFixed(4) + '%</span><div class="track"><div class="fill" style="width:' + w + '%;background:' + colours[j] + '"></div><div class="fairline"></div></div></div>';
  };
  var A = SOLID[L.A.col], B = SOLID[L.B.col];
  $('muVal').textContent = 'μ = ' + mu.toFixed(6);
  $('panel').innerHTML = '<h2>' + esc(L.line) + ' · Aequus ' + esc(L.name) + '</h2>' +
    '<p class="sub">A faces: ' + A + ' at distance 1 · B faces: ' + B + ' at distance μ · N = ' + L.N + ' (' + L.g + ')</p>' +
    '<span class="light' + (isFair ? ' on' : '') + '">' + (isFair ? 'fair' : 'not fair') + '</span>' +
    '<div class="bars">' + bar(0, L.A) + bar(1, L.B) + '</div>' +
    '<p class="note">Bar: the share of the view from the centre that one face takes (its solid angle over 4π). The line marks the fair share 1/N = ' + (fairShare * 100).toFixed(4) + '%. ' +
    'Fair value μ<sub>f</sub> = ' + L.muT + ' (Equanimity, Table 1; faces ' + L.faces[0] + '-gon and ' + L.faces[1] + '-gon).</p>' +
    '<p class="note">Solid angles by Van Oosterom and Strackee\'s formula (1983), on a fan of triangles from one corner of each face.</p>' + vacNote(plates);
  wirePickers($('panel'));
  cur = { S: S, name: L.line.replace(/ ∩ /g, '-and-') + '-mu-' + mu.toFixed(6), mirror: false }; $('stlBtn2').hidden = !canSave;
  if (isFair) console.assert(Math.abs(share[0] - fairShare) < 1e-9 && Math.abs(share[1] - fairShare) < 1e-9, 'shares at μf differ from 1/N on ' + L.line);
}

// ---------------- 3D print export (STL inside a zip; the viewer confirms the save)
var cur = null, canSave = false, dl = null;
function stlText(S, name, sizeMM, mirror) {
  var r = 0; S.verts.forEach(function (v) { r = Math.max(r, Math.hypot(v[0], v[1], v[2])); });
  var k = sizeMM / (2 * r), sx = mirror ? -k : k, out = ['solid ' + name];
  var V = S.verts.map(function (v) { return [v[0] * sx, v[1] * k, v[2] * k]; });
  S.faces.forEach(function (f) {
    for (var t = 1; t + 1 < f.v.length; t++) {
      var a = V[f.v[0]], b = V[f.v[t]], c = V[f.v[t + 1]];
      var n = G.cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]);
      var ln = Math.hypot(n[0], n[1], n[2]) || 1; n = [n[0] / ln, n[1] / ln, n[2] / ln];
      var m = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3];
      if (n[0] * m[0] + n[1] * m[1] + n[2] * m[2] < 0) { var tmp = b; b = c; c = tmp; n = [-n[0], -n[1], -n[2]]; }   // outward winding
      out.push(' facet normal ' + n.map(function (x) { return x.toExponential(6); }).join(' '), '  outer loop');
      [a, b, c].forEach(function (p) { out.push('   vertex ' + p.map(function (x) { return x.toFixed(5); }).join(' ')); });
      out.push('  endloop', ' endfacet');
    }
  });
  out.push('endsolid ' + name); return out.join('\n') + '\n';
}
var CRC = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipOne(fname, text) {   // a zip archive holding one stored (uncompressed) file
  var enc = new TextEncoder(), data = enc.encode(text), nm = enc.encode(fname), crc = crc32(data), sz = data.length;
  var lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);
  var ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true);
  var off = 30 + nm.length + sz;
  var end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, 46 + nm.length, true); end.setUint32(16, off, true);
  return new Blob([lh, nm, data, ch, nm, end], { type: 'application/zip' });
}
function exportSTL() {
  if (!cur || !dl) return;
  var size = 30;   // 30 mm across (circumscribed diameter)
  var safe = cur.name.replace(/[^A-Za-z0-9·.\-]+/g, '-').replace(/·/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');
  var stl = stlText(cur.S, safe, size, cur.mirror);
  dl.save({ filename: safe + '-30mm.zip', data: zipOne(safe + '-30mm.stl', stl) }).then(function () {}, function (err) {
    if (err && (err.code === 'unavailable' || err.code === 'not_granted')) { canSave = false; $('stlBtn').hidden = true; $('stlBtn2').hidden = true; }
  });
}
$('stlBtn').onclick = exportSTL; $('stlBtn2').onclick = exportSTL;
dl = { save: function (o) { return new Promise(function (ok) { var u = URL.createObjectURL(o.data); var a = document.createElement('a'); a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); ok(); }); } }; canSave = true;

// ---------------- load
var numsLoad = fetch('/aequi/numberings.json').then(function (r) { return r.json(); }).catch(function () { return null; });
Promise.all([fetch('/aequi/dice.json').then(function (r) { return r.json(); }), fetch('/aequi/fair.json').then(function (r) { return r.json(); }), fetch('/aequi/names.json').then(function (r) { return r.json(); })]).then(function (res) {
  data = res[0]; fair = res[1]; NAMES = res[2];
  numsLoad.then(function (x) { NUMS = x; if (tab === 'pick') updatePick(); });
  G.prepare(data); opposites();
  fillGroups(); fillLines();
  setGroup('Oh', [0, 1]);   // opens on Aequus CO-14
  setLine(1); resize();
}).catch(function (err) {
  $('panel').innerHTML = '<p class="err">The data did not load: ' + esc(err.message) + '</p>';
});
})();
</script>

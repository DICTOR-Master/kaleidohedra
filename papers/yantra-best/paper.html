<h1>The Best Yantra Renders<br><span style="font-size:0.72em;font-weight:normal">Nine pictures, one to a page</span></h1>
<div class="meta"><b>DICTO</b> · dictospheres.com · 8 November 2026</div>
<div class="status">For DICTO, not for publication. Every picture from the DICTO Yantra (Cleo-Antonius) unless named otherwise; the 3D view and both spheres redrawn from it today.</div>
<figure><img src="figures/dicto-yantra-gf1-plate.png" alt="The DICTO Yantra"><figcaption><b>1 · The DICTO Yantra.</b> Perfect by the rules: both small triangles on the circle, the bindu centred, 43 triangles, 18 marmas, 24 sandhis. Great pair: the Cleo-Antonius.</figcaption></figure>
<figure><img src="figures/even-plate.png" alt="The most even exact yantra"><figcaption><b>2 · The most even exact yantra.</b> Perfect to the eye: all 18 meetings and the 43 kept, the regions as equal as the structure allows, the small corners just inside the circle.</figcaption></figure>
<figure><img src="figures/even2-plate.png" alt="The most even yantra with its corners on the circle"><figcaption><b>3 · The middle way.</b> The most even yantra whose small triangles still touch the circle: all 18 meetings, the 43, corners on the circle; bindu not centred. Evenness 0.80, between the most even (0.61) and the DICTO Yantra (0.87).</figcaption></figure>
<figure><img src="figures/dicto-yantra-3d-gf1.png" alt="The DICTO Yantra in three dimensions"><figcaption><b>4 · In three dimensions.</b> Spinning: nine nested cones and the nine marma circles. Still: the tetrahedra. From one of the three positions: the yantra narrowed to cos 30°, every meeting kept.</figcaption></figure>
<figure><img src="figures/spherical-yantra-gf1.png" alt="The spherical DICTO Yantra"><figcaption><b>5 · The spherical yantra.</b> Every line a great circle, every meeting kept; from above the cap and tilted.</figcaption></figure>
<figure><img src="figures/cleo-sphere-yantras-gf1.png" alt="Twenty yantras on the Cleo-Icos sphere"><figcaption><b>6 · The Cleo sphere.</b> Twenty DICTO Yantras, one on each face of the Cleo-Icos.</figcaption></figure>
<figure><img src="figures/sphere81.png" alt="The 81-triangle sphere"><figcaption><b>7 · The 81 sphere.</b> Eighty DICTO Yantras on the twice-split Cleo sphere, the bindu at the centre: 81, the Kongōkai number.</figcaption></figure>
<figure><img src="figures/gnomon-yantra.png" alt="The gnomon yantra"><figcaption><b>8 · The gnomon.</b> The yantra and, in its bindu, the next one, endlessly (this version nests at 0.0631; the DICTO Yantra itself at 0.0550).</figcaption></figure>
<figure><img src="figures/stella-frame.png" alt="The stella octangula frame"><figcaption><b>9 · The frame.</b> The stella octangula: a hexagram down its axis, DICTO's upright rhombus from the side.</figcaption></figure>

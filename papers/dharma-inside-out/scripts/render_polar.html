<!doctype html><meta charset="utf-8"><title>Polar Dharma (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}#tag{position:fixed;right:14px;bottom:10px;font:600 14px system-ui;color:#5b5346}</style>
<div id="tag">DICTO · dictospheres.com</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// The Spheres of Dharma turned inside out (polar reciprocation), one kind of piece per layer; house palette, each layer its own colour.
(async function () {
  if (location.search.includes('notag')) document.getElementById('tag').hidden = true;   // inner levels of the seamless core
  const scn = location.hash.slice(1) || 'closed';
  const J = await fetch(location.search.includes('turns') ? 'polar-turns-render.json' : location.search.includes('rect') ? 'polar-rect-render.json' : location.search.includes('pairrid') ? 'polar-pair-rid-render.json' : location.search.includes('pair') ? 'polar-pair-render.json' : location.search.includes('tight') ? 'polar-tight-render.json' : location.search.includes('gsd') ? 'polar-gsd-render.json' : 'polar-render.json').then((r) => r.json());
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); const PX = +(new URLSearchParams(location.search).get('px') || 1000); renderer.setSize(PX, PX); renderer.setPixelRatio(1); renderer.localClippingEnabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ea);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.8)); const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(4, 7, 5); scene.add(sun);
  const COL = (location.search.includes('gsd') || location.search.includes('rect') || location.search.includes('turns')) ? [0x4dd0e1, 0xc792ea, 0x5fd38a, 0xf08fc0, 0x9fd8ff, 0xff9a52, 0x9fa8da] : location.search.includes('pair') ? [0x4dd0e1, 0xffb74d, 0xe57373] : location.search.includes('gsd') ? [0x4dd0e1, 0xc792ea, 0x5fd38a, 0xf08fc0, 0x9fd8ff, 0xff9a52, 0x9fa8da] : [0x4dd0e1, 0xc792ea, 0x5fd38a, 0xf08fc0, 0x9fd8ff, 0xff9a52];   // layers inside to outside; core gold
  const clip = scn.startsWith('cut') ? [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)] : [];
  const add = (S, col, shift, sh) => {
    const n = Math.hypot(...S.c) || 1, d = S.c.map((x) => (x / n) * shift);
    const P = S.v.map((v) => v.map((x, i) => S.c[i] + (x - S.c[i]) * sh + d[i]));
    const pos = [], line = [];
    for (const f of S.f) { for (let i = 1; i + 1 < f.length; i++) pos.push(...P[f[0]], ...P[f[i]], ...P[f[i + 1]]); for (let i = 0; i < f.length; i++) line.push(...P[f[i]], ...P[f[(i + 1) % f.length]]); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, flatShading: true, side: THREE.DoubleSide, clippingPlanes: clip, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(line, 3)); scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x2a2218, clippingPlanes: clip })));
  };
  const sh = scn === 'closed' ? 0.995 : 0.97, step = scn === 'apart' ? (location.search.includes('pair') ? 0.12 : location.search.includes('tight') ? 0.22 : 0.55) : 0;
  add(J.core, 0xffc857, 0, sh);
  J.layers.forEach((L, k) => { if (location.search.includes('pair') && k > (scn === 'inner' ? 1 : 2)) return; if (!location.search.includes('pair') && scn === 'inner' && k > (location.search.includes('gsd') ? 5 : 3)) return; for (const S of L.pieces) add(S, COL[(J.nlay ? k % J.nlay : k)], step * (k + 1), sh); });
  if (J.rects) for (const R of J.rects) {   // the 15 golden rectangles of the next turn's icosahedron
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute([...R[0], ...R[1], ...R[2], ...R[0], ...R[2], ...R[3]], 3)); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xd4a017, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: clip })));
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute([0, 1, 1, 2, 2, 3, 3, 0].flatMap((i) => R[i]), 3));
    scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x8a6400, clippingPlanes: clip })));
  }
  const ortho = new URLSearchParams(location.search).get('ortho');   // ?ortho=<half-width>: true-scale views for the seamless core
  const cam = ortho ? new THREE.OrthographicCamera(-ortho, +ortho, +ortho, -ortho, 0.001, 100) : new THREE.PerspectiveCamera(30, 1, location.search.includes('turns') ? 0.002 : 0.1, 100);
  const dist = (location.search.includes('turns') ? { closed: 10.5, cut: 10.5, cut2: 2.5, cut3: 2.5 / 4.236068, cut4: 2.5 / 17.944272, cut5: 2.5 / 76.013156, apart: 17, inner: 10.5 } : location.search.includes('rect') ? { closed: 18, cut: 18, apart: 22, inner: 18 } : location.search.includes('pair') ? { closed: 3.6, cut: 3.6, apart: 5.2, inner: 3.6 } : location.search.includes('tight') ? { closed: 5.8, cut: 5.8, apart: 9, inner: 5.2 } : location.search.includes('gsd') ? { closed: 10.5, cut: 10.5, apart: 17, inner: 9 } : { closed: 10.5, cut: 10.5, apart: 17, inner: 5.2 })[scn];
  const dir = scn.startsWith('cut') ? new THREE.Vector3(0.12, 0.2, 1) : new THREE.Vector3(0.62, 0.48, 0.9);
  cam.position.copy(dir.normalize().multiplyScalar(ortho ? 20 : dist)); cam.lookAt(0, 0, 0); renderer.render(scene, cam); document.title = 'ready';
})();
</script>

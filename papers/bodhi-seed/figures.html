<h1>The Bodhi seed (#24): figures</h1><p>Rendered from the checked kit data (studies/2026-10-12-bodhi-pieces). Diadem L and R are told apart by the handedness of the turn between them (60 each).</p><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/seed-closed.png" alt=""><figcaption><b>1.</b> The Bodhi seed: a rhombic triacontahedron of edge φ² (crystal) holding 12 of edge 1 (green), each touching 5 others face to face, around one of edge 1/φ at the centre (gold).</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/seed-open.png" alt=""><figcaption><b>2.</b> The 13 triacontahedra pulled apart.</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/hollow.png" alt=""><figcaption><b>3.</b> The hollow inside the 12: 60 Vajras around the centre close exactly into a rhombic hexecontahedron, 20 golden rhombohedra, one on each three-fold axis.</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/crowns.png" alt=""><figcaption><b>4.</b> The 20 Crown Jewels (blue), one in each outer three-fold corner, around the Vajras.</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/kitB-open.png" alt=""><figcaption><b>5.</b> Kit B pulled apart: 60 Vajras (gold), 20 Crown Jewels (blue), 60 Diadem L (lilac) and 60 Diadem R (pink); the 12 triacontahedra faint.</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/kitB-closed-gap.png" alt=""><figcaption><b>6.</b> Kit B closed, without the 12 triacontahedra: the gap itself, with their 12 sockets open.</figcaption></figure><figure><img src="https://raw.githubusercontent.com/DICTOR-Master/kaleidohedra/master/papers/bodhi-seed/fig/kitA-open.png" alt=""><figcaption><b>7.</b> Kit A pulled apart: 60 Vajras, 60 B2 (blue) and 60 B3 (lilac), all mirror-symmetric.</figcaption></figure></body></html>

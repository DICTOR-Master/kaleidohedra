status:
  scope: >-
    Formalized (Challenge, four theorems): lemma3 (pi, alpha, beta, gamma
    linearly independent over Q); lemma2 (angles round an edge of a tiling by
    convex polytopes, in every 3-dimensional real inner product space);
    theorem4a_copies and theorem4b_copies (Theorem 4 (a), (b) for tilings of
    R^3 by similar copies of the named solids and convex polytopes whose
    dihedral angles are nonnegative rational multiples of pi). Not
    formalized: the truncated icosidodecahedron as a named helper; Theorem 4
    (c) is in the library (Packets/Rings.lean), not in the Challenge.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Opus)"
      tool_setup: >-
        A Claude Code agent wrote the definitions, the statements and the
        proofs, the exact Q(sqrt 5) and Q(sqrt 2) generator of the solids'
        edge data (plain Python, scripts/gen_pieces.py) and the generator of
        the Challenge from the Lean sources, and ran the Lake builds and the
        comparator against Mathlib v4.35.0-rc2 on Linux compute machines.
      cost:
        wall_time: "about one day (22 November 2026)"
        spend_usd: "subscription-based"
        hardware: "local Linux machines"
      prompting_notes: >-
        DICTO found the result (paper #117), asked for its lead theorem in
        Lean, and set the order of the work: Lemma 3 and the ring condition,
        then Lemma 2 for every convex tiling, then the solids from
        coordinates with their angles read from the sets.
  spend_usd: "subscription-based"
  notes: >-
    DICTO posed the formalization and directed the work; every definition,
    statement and proof was written by the agent. Every build was checked by
    a full recompilation and #print axioms (only propext, Classical.choice
    and Quot.sound). No independent human line-by-line audit of the Lean
    code has been made.

fidelity:
  divergences: >-
    (1) Dihedral angles are read from the set: at a point where the
    directions v with v and -v in the tangent cone span a line K, the angle
    is 2 pi times the area of the cone's part of the unit disc of K-perp over
    the disc's area (EdgeAngle). (2) A tiling (ConvexTiling) is a family of
    convex polytopes (bounded intersections of finitely many closed
    half-spaces) with interior points, covering space, with pairwise
    disjoint interiors, locally finite; the paper's finitely many kinds at
    finitely many scales is replaced by local finiteness, which it implies.
    (3) Lemma 2 is stated at one point y of the same edge near the given
    point (the angles: the tile's own angle at the given point, and for each
    other tile through y a dihedral angle, pi or 2 pi), which is what the
    proof of Theorem 4 uses; the paper states it for all but finitely many
    points of the edge. (4) A similar copy is a positive scaling followed by
    an isometry (reflections allowed). (5) The solids are given by face
    normals and offsets: the dodecahedron, the icosahedron, their
    truncations and the two centre pyramids (apex at the origin) in Q(sqrt
    5), the truncated octahedron in Q, the truncated cuboctahedron in Q(sqrt
    2). (6) A helper piece with rational angles has every dihedral angle
    equal to q pi with q a nonnegative rational (RationalAngles). (7) The
    truncated icosidodecahedron is left out of the Challenge's helper list.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge is generated mechanically from the Lean sources, so every
    definition and statement is the library's own text (the one change: the
    qualifier DehnCanon.Library dropped); the Solution is the Challenge word
    for word with each proof transferred from the library. The solids' edge
    data were generated by an exact script and are rechecked in Lean. The
    comparator was run locally with Lean's kernel, NanoDa and con-ron, and
    three altered copies (a changed numeral, a changed definition, a proof
    replaced by sorry) were each rejected. Literature (22 November 2026): the
    formalized paper was read; the other sources are cited through it.
    Formal search (22 November 2026): GitHub code search of Lean files for
    Debrunner, dihedral angles of tilings, the truncated icosahedron,
    space-filling polyhedra and Dehn invariants of tilings found no
    formalization of tilings with dihedral angle conditions, of Debrunner's
    theorem or of these pairs (one unrelated file names the truncated
    icosahedron's vertex and edge counts); Mathlib v4.35.0-rc2 has no tilings
    of space by polytopes. The Dehn Canon is the related development.


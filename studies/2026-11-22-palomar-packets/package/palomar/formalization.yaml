# formalization.yaml v0.4 (Palomar submission kit; source rule: SOURCE-BASED, the paper #117 "formalizes")
version: "v0.4"

project:
  name: "Dehn Packets in Lean: two icosahedral pairs that cannot fill space"
  description: >-
    DICTO's paper "From Dehn Packets to Scutoids: How the Fullerene Star
    Fills Space" (Zenodo, 2026) proves, as its Theorem 4, that two pairs of
    icosahedral pieces whose Dehn invariants cancel cannot tile space: (a) no
    tiling of 3-space contains a dodecahedron centre pyramid or a truncated
    icosahedron if every tile is a similar copy (motion, reflection, positive
    scaling) of one of these two, of the dodecahedron, the icosahedron, the
    truncated octahedron or the truncated cuboctahedron, or a convex polytope
    whose dihedral angles are all nonnegative rational multiples of pi; (b)
    the same for the icosahedron centre pyramid and the truncated
    dodecahedron. The tiling need not be face to face. This entry proves (a)
    and (b) in Lean, with each named solid given by exact face inequalities
    over Q(sqrt 5) or Q(sqrt 2) and its dihedral angles read from the set
    itself, as in the registered Dehn Canon entry: at an edge point, the
    share of a small disc across the edge that lies in the tangent cone. It
    also proves the paper's two lemmas: Lemma 3, that pi, arctan(phi),
    arccos(1/sqrt 6) and arccos(sqrt(2/3)) are linearly independent over Q
    (Niven's theorem in Mathlib and a field argument), and Lemma 2, that the
    angles round an edge of a tiling by convex polytopes (locally finite,
    not necessarily face to face) sum to 2 pi, each being a dihedral angle of
    its tile, pi or 2 pi. The paper takes Lemma 2 from DICTO's earlier paper
    "Aristotle's Pyramid"; it is the edge-counting step behind Debrunner's
    theorem (1980). The proof of Theorem 4 counts the angles round one edge:
    the coefficients of the three irrational angles must cancel within one
    turn, and a weight argument removes the pieces one after another. Not
    formalized: the truncated icosidodecahedron of the paper's helper list
    (a library theorem covers it when its angles are given as a hypothesis);
    Theorem 4 (c), on the smallest ring, is proved in the library but is not
    in the Challenge; the rest of the paper (scutoid fillings, the Fullerene
    Star). Audience: researchers on tilings, space-filling polyhedra and
    scissors congruence, and Mathlib contributors.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"


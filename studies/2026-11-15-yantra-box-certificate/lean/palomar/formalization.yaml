# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Kulaichev's Sri Yantra is unique"
  description: >-
    Nine isosceles triangles with a common axis in a circle of diameter 1 that
    meet Huet's conditions in Chiodo's form (the two great triangles inscribed,
    seven apexes on bases, the 18 marmas and the 6 corner touches), Kulaichev's
    four conditions (a)-(d) and the admissibility of DICTO's paper #103
    (Theorem 1) form exactly one figure, the yantra of #103 Theorem 10, with
    slope w7/b7 = 0.7504385160222140244... This answers the question Kulaichev
    asked in 1984. The proof combines a kernel-checked branch-and-bound interval
    certificate (64,613 boxes in 10 charts, with proved monotone-split and slope
    enclosures), a Krawczyk box (uniqueness by a contraction, existence by
    Banach's fixed-point theorem), the forced construction from the geometry,
    and a verified sparse-polynomial normaliser for the identities between them.
    Scope: the same equations have exactly one other real solution in the range
    that admissibility needs, at w7/b7 = 0.66866..., and it is not admissible
    (bases out of order, two negative half-widths, t4 turned over), so it is not
    a yantra. Audiences: the history of mathematics (Kulaichev's question in the
    Indian Journal of History of Science, called still open in 2021), sacred
    geometry (the construction of the Sri Yantra), and computer-assisted proof in
    geometry (a certified interval computation checked by Lean's kernel).
  authors:
    - "DICTO"
  license: "Apache-2.0"
  responsible_maintainers:
    - "DICTO"

classification:
  arxiv: ["math.MG", "math.HO"]
  msc2020: ["51M04", "51M15", "65G20", "01A32", "03B35"]


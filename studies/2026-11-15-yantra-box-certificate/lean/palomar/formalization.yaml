      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Opus)"
      tool_setup: >-
        A Claude Code agent wrote the statements, the proofs, the generators of
        the certificate and identity modules (Python with Sage/Singular for the
        polynomial algebra and the linear_combination certificates) and ran the
        kernel checks with Lake against Mathlib v4.35.0-rc2 on Linux compute
        machines; decide +kernel only (no native_decide).
      cost:
        wall_time: "about two days (15-16 November 2026)"
        spend_usd: "subscription-based"
        hardware: "local Linux machines"
      prompting_notes: >-
        DICTO set the target (Kulaichev's question for #103) and the order of
        work (certificate, Lean checker, derivation, coverings, Krawczyk box,
        statement); the agent followed the study plan with milestone checks.
  spend_usd: "subscription-based"
  notes: >-
    DICTO posed the formalisation and directed the study; the uniqueness
    certificate, its Lean checker and every proof were written by the agent.
    Every milestone was checked by a Lake build and by #print axioms (only
    propext, Classical.choice and Quot.sound). No independent human
    line-by-line audit of the Lean code has been made.

fidelity:
  divergences: >-
    (1) The frame is fixed: diameter 1, depth measured down from the top point,
    t1-t5 pointing down; so "exactly one" means one 27-tuple (b, w, a). (2)
    Each condition is stated on the right half (mirror symmetry). (3) A triple
    point is the vanishing of the 3x3 determinant of the three lines, which
    also holds for three parallel lines; legs are never horizontal for an
    admissible figure. (4) Kulaichev (a) is stated as congruence (equal heights
    and half-widths); (d) as: the centre lies strictly between the base of t5
    and the apex of t1 and is equally far from that base and from the leg of
    t1. (5) The yantra is located by an interval for w7/b7 of width 2^-21, not
    by the minimal polynomial.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statement was compared with #103 Theorem 1 and the conditions listed in
    the study README. The certificate was checked three ways before Lean (exact
    integers, Arb ball arithmetic on a second machine, a negative control), and
    the Lean kernel modules were re-checked on a second machine and
    architecture. Literature (16 November 2026, free routes only): Kulaichev
    1984, Huet 2002 (author's version), Rao 1998, Pustynski 2014, Chiodo 2021,
    Santhi et al. 2012 and Tularam 2012 were read; Tahta 1992 (paywalled) and
    Kulaichev's addendum (no open copy) were not. None of them proves
    uniqueness; Pustynski claims it from plots without error bounds. A Synapse
    pre-registration on Rao's constraint system (synapsesocial.com, paper
    6a2f980ca1cfeec4908290b7) could not be opened (HTTP 429 behind a browser
    check; no Wayback copy); a search snippet describes it as a planned certified
    enumeration with no reported result.


    note: >-
      Read in the publisher's open scan. Conditions (a)-(d) and existence
      presumed, p. 284: "it may be presumed that there is, at least, one real
      solution (root), which may be calculated by some iterative method". The
      question, p. 285: "system 2 may or may not possess other real roots. The
      modern theory (higher algebra) does not give a direct answer to this
      question"; a polynomial of degree at most 12544; "These demands very far
      exceed the capacities of modern computers."

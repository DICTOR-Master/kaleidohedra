    authors:
      - "G. Huet"
    type: "paper"
    id: "https://gallium.inria.fr/~huet/PUBLIC/Nivat.pdf"
    location: "Theoretical Computer Science 281 (2002) 609-628; author's version (the id), pp. 2-3"
    relationship: "background"
    note: >-
      The conditions without Kulaichev's four. Author's version p. 2: it was
      "undecided whether Sri Yantra was indeed uniquely defined in the real plane,
      under-specified, or even impossible"; "a problem with 4 degrees of freedom,
      which admits several solutions". P. 3: "Sri Yantra is an under-determined
      Euclidean plane geometry problem with 4 real parameters, admitting an
      infinity of solutions around the Classical Sri Yantra."
  - title: "On the construction of the Sri Yantra"
    authors:
      - "A. Chiodo"
    id: "doi:10.5802/crmath.163"
    type: "paper"
    location: "Comptes Rendus Mathematique 359 (2021) 377-397"
    relationship: "background"
    note: >-
      Open access. Huet's conditions in the form used here. P. 381 (French):
      Kulaichev "fournit un raisonnement qui indique l'existence d'une solution
      et il se pose la question (toujours ouverte) de l'unicite". P. 387 (English,
      section 1.2.4): Kulaichev "discusses whether the solution is unique (p. 285),
      estimates the complexity, and argues that the answer is out of reach. This
      problem is not considered here"; the same page describes Kulaichev's short
      addendum (below).
  - title: "On mathematical complexity of Sriyantra"
    authors:
      - "V.-V. Pustynski"
    type: "paper"
    id: "https://insa.nic.in/writereaddata/UpLoadedFiles/IJHS/Vol49_3_5_Pustynski.pdf"
    location: "Indian Journal of History of Science 49.3 (2014) 268-277; pp. 269, 273-276"
    relationship: "background"
    note: >-
      Read in the publisher's open copy. Claims uniqueness from numerical plots,
      without error bounds: each step's function is plotted on a grid of 10,000
      points, "there is evidently no chance that local extrema could have been
      missed" (p. 273); "It may be concluded from Fig. 8 that Eq. (17) has a
      single root in the range 0.25 < Dy < 0.30. This proves that Sriyantra with
      restrictions set in (4) has a unique solution" (p. 274); "there is only one
      set of parameters satisfying the adopted constraints" (p. 275); a changed
      variant needs "the problem of uniqueness of that solution" studied again
      (p. 276). The entry gives the first certified proof; Chiodo (2021, p. 381)
      still calls the question open.
  - title: "Sriyantra - A Study of Spherical and Plane Forms"
    authors:
      - "C. S. Rao"
    id: "https://insa.nic.in/writereaddata/UpLoadedFiles/IJHS/Vol33_3_3_CSRao.pdf"

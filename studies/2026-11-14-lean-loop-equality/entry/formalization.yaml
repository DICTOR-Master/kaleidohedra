version: "v0.4"

project:
  name: "The Loop Equality: closed non-backtracking loops on every close-packed stacking"
  description: >-
    On the tetrahedral bond network of any close-packed stacking (diamond,
    lonsdaleite, every polytype, and every aperiodic stacking), every site has
    the same number of closed non-backtracking loops of each length m, and this
    number is an explicit integer loopCount m (0 for odd m; 24, 48, 480, 3432,
    ... for m = 6, 8, 10, 12, ...), computed from the closed-walk counts (Domb
    numbers, in Bala's chain form) by the non-backtracking recursion of
    Hashimoto and Bass. The development also proves the closed-walk equality at
    every atom of every stacking, a local loop formula for any graph with q + 1
    neighbours at every vertex and equal closed-walk counts, the values for
    m <= 34, and that the aperiodic Fibonacci stacking satisfies the equality
    with the same count. This formalises Theorem 1 of DICTO's paper #102.
  authors:
    - "DICTO"
  license: "Apache-2.0"
  responsible_maintainers:
    - "DICTO"


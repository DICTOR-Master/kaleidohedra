related_formalizations: []

status:
  scope: >-
    Formalised: #102 Theorem 1 for every close-packed stacking (periodic or
    not), every site and every length m >= 1, with finiteness; the explicit
    count loop_count_eq; the closed-walk counts at every atom (W_closed); the
    general local loop formula for (q+1)-regular graphs with equal closed-walk
    counts; the fifteen nonzero values of #102 for m <= 34; the Fibonacci
    stacking (stacking, Jagodzinski types, aperiodicity, loop corollary).
    Not formalised: the identity of loopCount with #102's Ihara-Bass series for
    all m (checked for m <= 12); Bala's identity between the chain form and
    Domb's closed form for all n (checked for n < 10); the equality of the
    cut-and-project and substitution forms of the Fibonacci word at every
    position (checked for positions < 100); #102's Corollaries 1-3 and Lemma 2
    (c); the equality of the vertical and slanted bond walk counts, which the
    proof does not need.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Opus)"
      tool_setup: >-
        A Claude Code agent wrote the Lean statements, proof outline and proofs
        in a terminal session, compiling with Lake against Mathlib v4.35.0-rc2
        on a Linux workstation; plain Mathlib tactics, decide and decide
        +kernel (no native_decide).
      cost:
        wall_time: "about two days (14-15 November 2026)"
        spend_usd: "subscription-based"
        hardware: "local Linux workstation"
      prompting_notes: >-
        DICTO set the target (#102 Theorem 1, then the explicit count, then the
        Fibonacci companion) and the order of work; the agent followed a
        written proof outline module by module, with milestone builds.
  spend_usd: "subscription-based"
  notes: >-
    DICTO conjectured the Loop Equality (#74), found the loop values to m = 34,
    and directed the proof in #102 and this formalisation. The Lean statements
    and proofs were written by the agent. Every milestone was checked by a
    clean Lake build and by #print axioms (only propext, Classical.choice and
    Quot.sound). No independent human line-by-line audit of the Lean code has
    been made.

fidelity:
  divergences: >-
    (1) The network is given combinatorially (integer planar coordinates,
    positions in ZMod 3); bond lengths are encoded by the six short vectors.
    (2) Loops are maps Fin m -> Atom with f 0 = v, so a loop and its reversal
    are counted separately, as in #102's t_m. (3) The formula proved for the
    count is the Hashimoto-Bass recursion applied to the closed walks, not
    #102's Ihara-Bass series; the two agree for m <= 12 (proved by kernel
    evaluation). (4) The proof compares each bond with a reference bond of
    diamond of the same kind instead of using diamond's symmetry group. (5)
    The Fibonacci word is defined by its two-sided cut-and-project form; it
    agrees with the substitution word c -> ch, h -> c at positions 0-99.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statement file was compared with #102 Theorem 1 and its Proposition
    (correspondence table in README.md). Positive and negative controls: the
    fifteen listed values are proved by kernel evaluation and a deliberately
    wrong value (loopCount 24 = 750276793) is rejected. The paper #102 had an
    automated check on aiXiv (2611.01038); it has not had human peer review.


      module: "Challenge"
      status: "proved"
      note: "Every stacking, every site, every m >= 1; nbLoops_finite makes ncard a true count."
    - source: "#102 Theorem 1, finiteness of the loop sets"
      lean: "DictoLoopEquality.nbLoops_finite"
      module: "Challenge"
      status: "proved"
      note: "Implicit in #102."
    - source: "#102 Theorem 1, 'Explicitly' (the count and its values)"
      lean: "DictoLoopEquality.loop_count_eq"
      module: "Challenge"
      status: "proved"
      note: "loopCount is the Hashimoto-Bass recursion applied to the closed walks; values in loopCount_values and loopCount_values_34."
    - source: "#102 values t_m for m = 3..34"
      lean: "DictoLoopEquality.loopCount_values_34"
      module: "Challenge"
      status: "proved"
      note: "With loopCount_values; kernel evaluation."
    - source: "#102 Ihara-Bass series"
      lean: "DictoLoopEquality.loopCount_eq_iharaBass_small"
      module: "Challenge"
      status: "partial"
      note: "Agreement for 1 <= m <= 12 only."
    - source: "#102 Lemma 2 (a) and Proposition (closed walks; Thorpe 1972 for periodic polytypes)"
      lean: "DictoLoopEquality.W_closed"
      module: "Challenge"
      status: "proved"
      note: "At every atom of every stacking; bond_iff ties the neighbour function to the bonds; closedWalks_domb_small compares with Domb's closed form for n < 10."
    - source: "#102 Lemma 3 summed over the bonds at a vertex"
      lean: "DictoLoopEquality.Graph.loops_ncard_eq_FD"
      module: "Challenge"
      status: "proved"
      note: "General graphs with q + 1 neighbours everywhere and equal closed-walk counts; stated in this generality here, not in #102."
    - source: "Fibonacci stacking (DICTO's Fibonacci stackings study and #102 checks)"
      lean: "DictoLoopEquality.fibonacci_loop_equality"
      module: "Challenge"
      status: "proved"
      note: "With fibonacci_isStacking, fibonacci_zero, fibonacci_one, fibonacci_layer_type, isH_eq_word and fibonacci_not_periodic."


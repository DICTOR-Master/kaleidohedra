# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The Dehn Canon: Hilbert's Third Problem, Machine-Checked"
  description: >-
    Dehn's answer to Hilbert's third problem, with the Dehn invariant defined
    from the solid as a set of points in 3-space rather than from a list of
    edges. For a set P, the invariant dehnSet P in R (x)_Q (R/Q pi) adds, over
    the angle classes theta, the length (1-dimensional Hausdorff measure) of the
    points of P whose cone of directions has a line as its lineality space and
    the angle class theta there, the angle being 2 pi times the area of the cone
    in the unit disc across that line divided by the area of the disc. Proved:
    (1) Hilbert's problem in his words: two tetrahedra on one and the same base
    triangle, with apexes at the same distance 1 from its plane and volume 1/6,
    that are neither scissors congruent nor equicomplementable (pieces: convex
    polytopes moved by isometries); (2) for every convex polytope with interior
    points, dehnSet P equals the classical sum over its edges of length (x)
    dihedral angle, with edges, facets and dihedral angles also defined from the
    set (Dehn's invariant in Jessen's tensor form); (3) the bridge:
    scissors-congruent convex polytopes have the same invariant, in every
    3-dimensional real inner product space, and for finite unions of convex
    polytopes the total over the pieces does not depend on the dissection and is
    kept by scissors congruence; (4) Dehn's theorem: no similar copy of the
    regular tetrahedron is scissors congruent to a similar copy of the cube. The
    theorem is classical (Dehn 1901) and already formalized in Lean in
    FormalBook's chapter 10, in an abstract model of edges and angles; what is
    added here is the set-defined invariant, the proved bridge from geometric
    dissections, its agreement with the edge sum, and Hilbert's statement for
    tetrahedra as point sets. The entry is meant for researchers in formalized
    geometry and in scissors congruence: since the invariant and the bridge are
    stated for sets and for every dissection into convex polytopes, they can
    serve as a base in Lean for Sydler's converse, Jessen's work in four
    dimensions and a theory of valuations in Mathlib; none of these is
    attempted here.
  authors:
    - "DICTO"
  license: "Apache-2.0"
  responsible_maintainers:
    - "DICTO"

classification:
  arxiv: ["math.MG", "math.HO"]
  msc2020: ["52B45", "52B10", "51M20", "03B35"]

sources:
  - title: "Ueber den Rauminhalt"
    authors:
      - "M. Dehn"
    id: "doi:10.1007/BF01448001"
    type: "paper"
    location: "Mathematische Annalen 55 (1902) 465-478 (issue 3, September 1901)"
    relationship: "formalizes"
    note: >-
      Dehn's invariant and his theorem that the regular tetrahedron and the
      cube are not scissors congruent (similarTetra_not_scissorsCongruent_similarCube),
      and his answer to Hilbert's question (hilbert_third_problem). The invariant
      is used in Jessen's tensor form (below). Cited, not reread for this entry.
      Volume 55 is dated 1902 (Goettingen digital library record of the
      volume); issue 3, with this paper, appeared in September 1901 (Crossref).
    author_endorsement: "n/a"
  - title: "Ueber raumgleiche Polyeder"
    authors:
      - "M. Dehn"
    type: "paper"
    location: "Nachrichten von der Gesellschaft der Wissenschaften zu Goettingen, Mathematisch-Physikalische Klasse (1900) 345-354"
    relationship: "formalizes"
    note: >-
      Dehn's first announcement of his answer to Hilbert's third problem,
      before the Mathematische Annalen paper above. Pages from the Goettingen
      digital library's record of the 1900 volume and EuDML; not reread.
    author_endorsement: "n/a"
  - title: "Mathematische Probleme (problem 3)"
    authors:
      - "D. Hilbert"
    contributors:
      - name: "M. W. Newson"
        role: "translator: Mathematical problems, Bull. Amer. Math. Soc. 8 (1902) 437-479"
    type: "paper"
    location: "Nachrichten der Gesellschaft der Wissenschaften zu Goettingen (1900) 253-297, problem 3; English by Newson, Bull. Amer. Math. Soc. 8 (1902) 437-479"
    relationship: "formalizes"
    note: >-
      The statement of hilbert_third_problem follows Hilbert's sentence (problem
      3, Bull. Amer. Math. Soc. 8, p. 449): "two
      tetrahedra of equal bases and equal altitudes which can in no way be split
      up into congruent tetrahedra, and which cannot be combined with congruent
      tetrahedra to form two polyhedra which themselves could be split up into
      congruent tetrahedra". The sentence was compared fragment by fragment with
      the Wikisource transcription of Newson's translation and with the scan of
      the Bulletin (read 19 November 2026; the same words). Hilbert's pages
      253-297 checked against the Goettingen digital library's record.
    author_endorsement: "n/a"
  - title: "The algebra of polyhedra and the Dehn-Sydler theorem"
    authors:
      - "B. Jessen"
    type: "paper"
    location: "Mathematica Scandinavica 22 (1968) 241-256"
    relationship: "background"
    note: "The tensor form, the sum of length (x) angle in R (x)_Q (R/Q pi), used for dehnSet and in dehnSet_eq_edge_sum. Cited, not reread."
    author_endorsement: "n/a"
  - title: "Proofs from THE BOOK, chapter 10 \"Hilbert's third problem: decomposing polyhedra\", Examples 2 and 3"
    authors:
      - "M. Aigner"
      - "G. M. Ziegler"
    type: "book"
    location: "6th edition, Springer, Berlin, 2018, chapter 10, pp. 67-75 (doi:10.1007/978-3-662-57265-8_10); the tetrahedra T1 and T2 of the chapter"
    relationship: "background"
    note: >-
      The pair of tetrahedra of hilbert_third_problem (here placed on one base
      triangle) and their dihedral angles. The book was not opened; the
      examples were read from the docstrings of FormalBook's Chapter_10.lean
      (related formalization below) and the angles recomputed by an
      independent exact script. Edition, chapter and pages from the publisher's
      record (Crossref).
    author_endorsement: "n/a"
  - title: "Sur une question de geometrie relative aux polyedres"
    authors:
      - "R. Bricard"
    type: "paper"
    location: "Nouvelles annales de mathematiques, 3e serie, 15 (1896) 331-334"
    relationship: "background"
    note: >-
      Bricard's condition (an integer combination of the dihedral angles is a
      multiple of pi), the route of Proofs from THE BOOK and of FormalBook's
      chapter 10 (related formalizations); not used by this entry. Read
      (Numdam scan).
    author_endorsement: "n/a"
  - title: "Conditions necessaires et suffisantes pour l'equivalence des polyedres de l'espace euclidien a trois dimensions"
    authors:
      - "J.-P. Sydler"
    type: "paper"
    location: "Commentarii Mathematici Helvetici 40 (1965) 43-80"
    relationship: "background"
    note: "The converse (volume and Dehn invariant decide scissors congruence). Quoted, not used and not formalized."
    author_endorsement: "n/a"
  - title: "Geometry: Euclid and Beyond, Chapter 5, section 27 \"Hilbert's Third Problem\""
    authors:
      - "R. Hartshorne"
    type: "book"
    location: "Undergraduate Texts in Mathematics, Springer, New York, 2000, pp. 231-240 (Proposition 27.2, p. 235)"
    relationship: "background"
    note: >-
      The textbook edge argument for additivity under gluing (Proposition 27.2),
      the argument behind the plane-cut identity (dehnSet_cut) of the
      development. Read (section 27). The edge sum (dehnSet_eq_edge_sum) does

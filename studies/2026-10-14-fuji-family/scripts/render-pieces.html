<!doctype html><html><head><meta charset="utf-8"><title>Pieces render (DICTO)</title>
<style>html,body{margin:0;background:#14110d}#c{width:1200px;height:1100px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><div id="c"></div>
<script>
// Clean, framed renders of single pieces for the FUJI family paper (DICTO, 2026-10-14): app colours, dark edges,
// each piece centred with a generous margin. window.show(name) draws one piece; the page is screenshotted by render-pieces.mjs.
const COL = { equi: 0xc792ea, iso: 0xe2bdf7, base: 0x4dd0e1, square: 0x4dd0e1, hex: 0xc792ea, port: 0x1c1826, seam: 0x0b1220, w0: 0x4dd0e1, w1: 0xc792ea, w2: 0xffc857, w3: 0x5fd38a, w4: 0xf08fc0, w5: 0x9fd8ff, edge: 0x2a2633 };
const host = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1);
renderer.setSize(1200, 1100); host.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14110d);
const camera = new THREE.PerspectiveCamera(30, 1200 / 1100, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x1a1626, 0.62));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); scene.add(sun);
const headlight = new THREE.DirectionalLight(0xffffff, 0.35); scene.add(headlight);
let current = null;
window.show = (name, dir, up, fixR) => {
  if (current) scene.remove(current);
  const P = DATA[name]; const c = P.v.reduce((a, v) => a.map((x, i) => x + v[i] / P.v.length), [0, 0, 0]);
  const V = P.v.map(v => v.map((x, i) => x - c[i]));
  // Crystal (DICTO 2026-10-14): a tag ending in 'g' (w1g, w5g, ...) is see-through glass of that colour, its edges pale.
  const g = new THREE.Group(), cc = new THREE.Color();
  const buf = { solid: { pos: [], col: [], ep: [] }, glass: { pos: [], col: [], ep: [] } };
  P.f.forEach((f, fi) => { const tag = P.t[fi] ?? ''; const isGlass = tag.length > 2 && tag.endsWith('g'); const b = isGlass ? buf.glass : buf.solid;
    cc.setHex(COL[isGlass ? tag.slice(0, -1) : tag] ?? 0xcccccc);
    for (let i = 1; i + 1 < f.length; i++) for (const k of [f[0], f[i], f[i + 1]]) { b.pos.push(...V[k]); b.col.push(cc.r, cc.g, cc.b); }
    for (let i = 0; i < f.length; i++) b.ep.push(...V[f[i]], ...V[f[(i + 1) % f.length]]); });
  for (const [key, b] of Object.entries(buf)) {
    if (!b.pos.length) continue;
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3)); geo.computeVertexNormals();
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(b.ep, 3));
    const glass = key === 'glass';
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide, roughness: .8, metalness: 0,
      transparent: glass, opacity: glass ? 0.22 : 1, depthWrite: !glass, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    if (glass) mesh.renderOrder = 2;
    g.add(mesh);
    if (P.f.length <= 5000) g.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial(glass ? { color: 0xd8f0ff, transparent: true, opacity: 0.55 } : { color: 0x0b1220 })));
  }
  scene.add(g); current = g;
  const R = fixR ?? V.reduce((m, v) => Math.max(m, Math.hypot(...v)), 0);
  const d = new THREE.Vector3(...dir).normalize(), dist = R * 1.18 / Math.sin(THREE.MathUtils.degToRad(15));
  camera.position.copy(d.clone().multiplyScalar(dist)); camera.up.set(...(up ?? [0, 1, 0])); camera.lookAt(0, 0, 0);
  sun.position.set(3, 5, 4).applyQuaternion(camera.quaternion); headlight.position.copy(camera.position);
  renderer.render(scene, camera); return true;
};
</script></body></html>

      lean: "DehnHadwiger4D.dehnHadwiger_eq_of_scissorsCongruent"
      module: "Challenge"
      status: "proved"
    - source: "Hadwiger 1954, for finite unions of convex polytopes"
      lean: "DehnHadwiger4D.dehnHadwigerSum_eq_of_scissors"
      module: "Challenge"
      status: "proved"
    - source: "The 5-cell's invariant"
      lean: "DehnHadwiger4D.dehnHadwiger_cell5_ne_zero"
      module: "Challenge"
      status: "proved"
    - source: "The 600-cell's invariant"
      lean: "DehnHadwiger4D.dehnHadwiger_cell600_ne_zero"
      module: "Challenge"
      status: "proved"
    - source: "Non-congruence across the split of the six regular 4-polytopes"
      lean: "DehnHadwiger4D.similarCell600_not_scissorsCongruent"

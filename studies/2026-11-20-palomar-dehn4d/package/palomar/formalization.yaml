status:
  scope: >-
    Formalized (Challenge, fourteen theorems): the bridge
    (dehnHadwiger_eq_of_scissorsCongruent, dehnHadwigerSum_eq_of_scissors), in
    every finite-dimensional real inner product space; the invariants of the
    tesseract, 16-cell, 24-cell, 120-cell (zero), the 5-cell and the 600-cell
    (exact form and non-zero); arccos(1/4) not in Q pi; non-congruence of
    similar copies of the 5-cell or the 600-cell with similar copies of the
    four others, and of the 5-cell with the 600-cell. Pieces are convex
    polytopes, finitely many, moved by isometries including reflections. Not
    formalized: Jessen's converse in R^4; the face-sum formula for an arbitrary
    convex polytope; Hadwiger's invariants of other codimensions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Opus)"
      tool_setup: >-
        A Claude Code agent wrote the definitions, the statements and the
        proofs, the exact Z[phi] data generator (plain Python) and the generator
        of the Challenge from the Lean sources, and ran the Lake builds and the
        comparator against Mathlib v4.35.0-rc2 on Linux compute machines; no
        native_decide (the data checks use decide +kernel).
      cost:
        wall_time: "about one day (20 November 2026)"
        spend_usd: "subscription-based"
        hardware: "local Linux machines"
      prompting_notes: >-
        DICTO set the target (the bridge first, then the six regular
        4-polytopes, the 5-cell against the 600-cell stated only if true, and
        the credits) after the Dehn Canon entry.
  spend_usd: "subscription-based"
  notes: >-
    DICTO posed the formalization and directed the work; every definition,
    statement and proof was written by the agent. Every build was checked by a
    full recompilation and #print axioms (only propext, Classical.choice and
    Quot.sound). No independent human line-by-line audit of the Lean code has
    been made.

fidelity:
  divergences: >-
    (1) The invariant is defined from the set: the class at a point is the
    angle of the tangent cone in the plane orthogonal to its lineality space
    where that space has codimension 2, else 0, and the invariant sums
    (n-2)-dimensional Hausdorff measure of the points of each class; for a
    convex polytope in R^4 these points are the relative interior points of
    the 2-faces, and for the six polytopes the angle is computed as pi minus
    the angle between the two facet normals. (2) Scissors congruence uses
    convex polytopes as pieces and isometries including reflections. (3) The
    regular polytopes are given by facet normals with offset 1: tesseract
    [-1,1]^4, the 16-cell and a 24-cell by whole-number normals, the 5-cell by
    five normals of length 4 with dot products -4, the 120-cell by the 120
    vertices of a 600-cell and the 600-cell by the 600 vertices of a 120-cell,
    both in Z[phi] (the 600 are generated by sign changes and orderings of seven
    vectors). A similar copy is a scaling by a > 0 followed by an isometry. (4)
    The relation of the 600-cell's dihedral angle to the 5-cell's is stated
    through the two invariants, A5 tensor arccos(1/4) and A600 tensor
    (4 pi / 3 - arccos(1/4)).

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge is generated mechanically from the Lean sources, so every
    definition and statement is the development's own text; the Solution is the
    Challenge word for word with each proof transferred from the development.
    The 600-cell data (normals, corners, facet neighbours) were generated by an
    exact Z[phi] script and are rechecked in Lean by kernel evaluation; the
    relation of the two dihedral angles was also checked in exact arithmetic in
    a separate study. The comparator was run locally with Lean's kernel, NanoDa
    and con-ron, and three altered copies (a changed constant, a changed
    definition, a proof replaced by sorry) were each rejected. Literature (20
    November 2026, free routes only): bibliographic records of every source
    checked on Crossref or zbMATH; the papers themselves were not read. Formal
    search (20 November 2026): GitHub Lean code for Dehn invariant, Hadwiger
    and scissors congruence (atlas-lean, undergraduate-math-lean, FormalBook:
    dimension 3 only); Mathlib has no Dehn invariant; no formalization of the
    Dehn-Hadwiger invariant in dimension 4 was found.


# Source rule: SOURCE-BASED (Hadwiger 1954 "formalizes"; no original-proof source).
version: "v0.4"

project:
  name: "The Dehn–Hadwiger invariant in four dimensions"
  description: >-
    Hadwiger (Math. Ann. 127, 1954) extended Dehn's invariant to convex
    polytopes in R^n: for the faces of codimension 2, the sum of their
    (n-2)-dimensional volume tensored with the dihedral angle modulo rational
    multiples of pi is kept under dissection. This entry defines that invariant
    from the set alone, in every finite-dimensional real inner product space:
    at each point the cone of directions that stay in the set, its lineality
    space, and, where that space has codimension 2, the angle of the cone in
    the orthogonal plane; the invariant sums (n-2)-dimensional Hausdorff measure
    tensored with the angle class, in R tensor_Q (R / Q pi). It proves the
    bridge: scissors-congruent convex polytopes (pieces are convex polytopes
    moved by isometries) have the same invariant, in every dimension, also for
    finite unions of convex polytopes. In R^4 it computes the invariant of the
    six regular polytopes: zero for the tesseract, the 16-cell, the 24-cell and
    the 120-cell; for the 5-cell it is A5 tensor arccos(1/4) and for the
    600-cell A600 tensor (4 pi / 3 - arccos(1/4)), where A is the area of the
    ridge points, positive in both; arccos(1/4) is not a rational multiple of
    pi (Niven's theorem in Mathlib). Hence no similar copy of the 5-cell or of
    the 600-cell is scissors congruent to a similar copy of the tesseract, the
    16-cell, the 24-cell or the 120-cell, and, because the 600-cell's dihedral
    angle is 4 pi / 3 minus the 5-cell's, their invariants have opposite signs
    and no similar copy of the 5-cell is scissors congruent to a similar copy of
    the 600-cell. The non-congruence of the regular simplex and the cube is
    classical; the entry claims no new mathematics, only the formalization.
    The 600-cell needs the face structure: at every ridge point the two tight
    facets are neighbours across a triangle; this is proved from exact Z[phi]
    data (its 600 facet normals, 120 corners and, for every facet, its four
    corners and four neighbours) checked by kernel evaluation, with a
    barycentric argument on the facet. Not formalized: Jessen's converse in R^4
    (equal volume and equal invariant imply scissors congruence), Hadwiger's
    other invariants in higher dimensions, and the identification of the set
    invariant with the face sum for every convex polytope (the six polytopes
    are computed directly). The library reuses the Dehn Canon development
    (registered PALOMAR-2026-11-20-000003) for convex polytopes, cones, wedge
    angles, cuts and dissections. Audience: researchers on scissors congruence,
    valuations on polytopes and regular polytopes, and Mathlib contributors.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"


<!doctype html><meta charset="utf-8"><title>Five-fold golden fill (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}#tag{position:fixed;right:12px;bottom:8px;font:600 14px system-ui;color:#5b5346}#ttl{position:fixed;left:12px;top:8px;font:600 16px system-ui;color:#2b2620}</style>
<div id="ttl"></div><div id="tag">DICTO · dictospheres.com</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Golden Bodhi Pyrochlore, five-fold chorus: the golden region around the central DICTO Ogdoecontahedron cut into pieces by the
// golden planes of the envelopes; Mudras (a Bodhi piece) in magenta, other golden pieces in cyan shades by volume class.
// #top (down the five-fold axis) | #tilt | #apart (pieces pushed out).
(async function () {
  const [N, G] = await Promise.all([fetch('network-render.json').then((r) => r.json()), fetch('chorus-golden.json').then((r) => r.json())]);
  const scn = location.hash.slice(1) || 'top', C = new THREE.Vector3(...G.centre), a5 = new THREE.Vector3(...G.a5);
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(1000, 1000); r.setPixelRatio(1); document.body.prepend(r.domElement);
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0xf4f1ea); sc.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.9)); const sun = new THREE.DirectionalLight(0xffffff, 0.6); sc.add(sun);
  function hullGeo(P) {
    const V = P.map((p) => new THREE.Vector3(...p)), pos = [];
    for (let a = 0; a < V.length; a++) for (let b = a + 1; b < V.length; b++) for (let c = b + 1; c < V.length; c++) {
      const n = new THREE.Vector3().subVectors(V[b], V[a]).cross(new THREE.Vector3().subVectors(V[c], V[a])); if (n.length() < 1e-12) continue; n.normalize();
      let s = 0, ok = true; for (const p of V) { const t = n.dot(p.clone().sub(V[a])); if (Math.abs(t) < 1e-9) continue; if (!s) s = Math.sign(t); else if (Math.sign(t) !== s) { ok = false; break; } }
      if (ok) pos.push(...P[a], ...P[b], ...P[c]); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
  }
  function add(g, col, opacity, at) {
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, flatShading: true, side: THREE.DoubleSide, transparent: opacity < 1, opacity, depthWrite: opacity >= 1 }));
    const l = new THREE.LineSegments(new THREE.EdgesGeometry(g, 1), new THREE.LineBasicMaterial({ color: 0x2a2218, transparent: opacity < 1, opacity: Math.min(1, opacity + 0.25) }));
    const grp = new THREE.Group(); grp.add(m, l); if (at) grp.position.copy(at); sc.add(grp); return grp;
  }
  const opos = []; for (const f of N.f) for (let i = 1; i + 1 < f.length; i++) opos.push(...N.v[f[0]], ...N.v[f[i]], ...N.v[f[i + 1]]);
  const OG = new THREE.BufferGeometry(); OG.setAttribute('position', new THREE.Float32BufferAttribute(opos, 3)); OG.computeVertexNormals();
  add(OG, 0xffc857, 1, C);
  if (scn !== 'apart') for (const p of G.neighbours) add(OG, 0xd8cdb8, 0.22, new THREE.Vector3(...p));
  const vols = G.pieces.map((P) => { const g = hullGeo(P); g.computeBoundingBox(); return g; });
  const CY = [0x4dd0e1, 0x26a69a, 0x81d4fa, 0x0097a7, 0x80cbc4, 0x5c6bc0];
  G.pieces.forEach((P, i) => {
    const g = vols[i]; const c = P.reduce((s, v) => s.map((x, k) => x + v[k] / P.length), [0, 0, 0]); const cv = new THREE.Vector3(...c);
    const push = scn === 'apart' ? cv.clone().sub(C).multiplyScalar(0.45) : new THREE.Vector3();
    const grp = add(g, G.mudra[i] ? 0xe91e63 : CY[i % CY.length], 1); grp.position.copy(push);
  });
  const up = new THREE.Vector3(0, 0, 1).sub(a5.clone().multiplyScalar(a5.z)).normalize(); if (up.length() < 0.5) up.set(1, 0, 0);
  const dir = scn === 'top' ? a5.clone() : a5.clone().multiplyScalar(0.75).add(up.clone().multiplyScalar(0.55)).normalize();
  const H = scn === 'apart' ? 1.9 : 1.35, cam = new THREE.OrthographicCamera(-H, H, H, -H, -50, 50);
  cam.position.copy(C.clone().add(dir.multiplyScalar(20))); cam.up.copy(up); cam.lookAt(C); sun.position.copy(cam.position.clone().add(up.clone().multiplyScalar(8)));
  r.render(sc, cam);
  document.getElementById('ttl').textContent = `five-fold golden fill: ${G.pieces.length} golden pieces round the central copy, ${G.mudra.filter(Boolean).length} Mudras (magenta) · ${scn}`;
  document.title = 'ready';
})();
</script>

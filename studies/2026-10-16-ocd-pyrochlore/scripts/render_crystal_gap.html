<!doctype html><meta charset="utf-8"><title>Crystal gap pieces (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// The gap of the pyrochlore two-solid crystal in convex pieces (?who=stella|ico&pull=&px=): one solid (glass) with its share of the gap,
// pieces coloured by kind and pulled out from the centre by the factor pull (1 = in place).
(async function () {
  const q = new URLSearchParams(location.search), WHO = q.get('who') || 'stella', PULL = +(q.get('pull') || 1.35), PX = +(q.get('px') || 1000);
  const J = await fetch('crystal-gap-pieces.json').then((r) => r.json());
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(PX, PX); renderer.setPixelRatio(1);
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ea);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.85)); const sun = new THREE.DirectionalLight(0xffffff, 0.6); scene.add(sun);
  const KC = { 'ico3': 0x4dd0e1, 'stella3': 0x26a69a, 'stella6': 0xc792ea, 'stella4': 0xef6c8f };
  function solid(V, F, color, op, sh = new THREE.Vector3()) {
    const pos = [], line = []; const P = (k) => [V[k][0] + sh.x, V[k][1] + sh.y, V[k][2] + sh.z];
    for (const f of F) { for (let i = 1; i + 1 < f.length; i++) for (const k of [f[0], f[i], f[i + 1]]) pos.push(...P(k)); for (let i = 0; i < f.length; i++) line.push(...P(f[i]), ...P(f[(i + 1) % f.length])); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true, side: THREE.DoubleSide, transparent: op < 1, opacity: op, depthWrite: op >= 1, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    m.renderOrder = op < 1 ? 2 : 0; scene.add(m);
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(line, 3));
    scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x2a2218, transparent: true, opacity: op < 1 ? 0.25 : 0.8 })));
  }
  const S = J[WHO]; solid(S.v, S.f, 0xf2d27e, 0.25);
  for (const p of J.pieces) if (p.solid === WHO) {
    const c = p.v.reduce((a, x) => a.add(new THREE.Vector3(...x)), new THREE.Vector3()).multiplyScalar(1 / p.v.length);
    solid(p.v, p.f, KC[p.solid + p.face], 1, c.clone().multiplyScalar(PULL - 1));
  }
  const dir = new THREE.Vector3(0.62, 0.48, 1).normalize(), R = 1.05 * PULL;
  const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.1, 100); cam.position.copy(dir.clone().multiplyScalar(20)); cam.lookAt(0, 0, 0);
  sun.position.copy(dir.clone().add(new THREE.Vector3(0.3, 0.9, 0)).multiplyScalar(10)); renderer.render(scene, cam); document.title = 'ready';
})();
</script>

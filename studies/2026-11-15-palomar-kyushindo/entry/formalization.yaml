# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The octahedral constant 3: a symmetric polytope lies in three times the hull of its facet foot points"
  description: >-
    A convex polytope S = {x : <n_i, x> <= h_i} with unit normals n_i and
    positive distances h_i, whose family of face planes is invariant under the
    octahedral rotation group (24 rotations), lies inside 3 times the convex
    hull P(S) of its foot points h_i n_i; for the cube no factor c with
    0 <= c < 3 works. The development also proves the covering lemma used for
    it (every orbit of the octahedral rotation group on the unit sphere comes
    within angle arccos(1/sqrt 3) of every direction, in the general form
    |u||w|/sqrt 3 <= <g u, w> for some rotation g), which is the upper bound
    diam(S^2/O) <= arccos(1/sqrt 3) for the known diameter of the orbit space
    (the bound is attained). This formalises Theorem 4 of
    DICTO's paper #43, "Kyushindo Cores".
  authors:
    - "DICTO"
  license: "Apache-2.0"
  responsible_maintainers:
    - "DICTO"


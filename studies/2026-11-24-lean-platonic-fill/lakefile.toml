name = "PlatonicFill"
version = "0.1.0"
defaultTargets = ["Packets", "PlatonicFill"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Packets"
globs = ["Packets.+"]

[[lean_lib]]
name = "PlatonicFill"
globs = ["PlatonicFill.+"]

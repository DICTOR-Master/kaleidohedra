<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="DejaVu Sans, sans-serif"><g transform="translate(0.00,0.00)"><text x="8.00" y="16.00" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">1  Check angle and spacing with the card</text><text x="8.00" y="31.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#333">Stand the card upright on the lower sheet;</text><text x="8.00" y="43.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#333">the long leg must just reach the upper sheet.</text><rect x="10" y="250" width="290" height="8" fill="#efe9da" stroke="#6f6a5e"/><rect x="10" y="86.87" width="290" height="8" fill="#efe9da" stroke="#6f6a5e"/><polygon points="60.00,250.00 169.70,250.00 169.70,94.87" fill="#faf6ea" fill-opacity="0.92" stroke="#000" stroke-width="1.0" stroke-linejoin="round"/><line x1="60.00" y1="250.00" x2="169.70" y2="94.87" stroke="#2bb3a3" stroke-width="5" stroke-linecap="round"/><text x="114.85" y="272.00" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#000">short leg on the sheet</text><text font-size="9.5" text-anchor="middle" transform="translate(183.7,172.4) rotate(-90)">long leg upright = d</text><text font-size="9.5" text-anchor="middle" transform="translate(100.8,164.4) rotate(-54.7)">cord along the slanted edge</text><path d="M 82 250 A 22 22 0 0 0 72.70 232.04" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="86.00" y="244.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000">54.7°</text></g><g transform="translate(320.00,0.00)"><text x="8.00" y="16.00" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">2  Plumb line from the top sheet</text><text x="8.00" y="31.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#333">Thread and a small weight from node 1.</text><rect x="10" y="250" width="280" height="8" fill="#efe9da" stroke="#6f6a5e"/><rect x="10" y="70" width="280" height="8" fill="#efe9da" stroke="#6f6a5e"/><circle cx="190.00" cy="74.00" r="4.5" fill="#8a5cc2" stroke="none" stroke-width="1"/><text x="198.00" y="64.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000">node 1 of the top sheet</text><line x1="190.00" y1="78.00" x2="190.00" y2="236.00" stroke="#000" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 2"/><polygon points="184.00,236.00 196.00,236.00 190.00,247.00" fill="#555" fill-opacity="1" stroke="#555" stroke-width="0.8" stroke-linejoin="round"/><circle cx="110.00" cy="254.00" r="4.5" fill="#666" stroke="none" stroke-width="1"/><text x="110.00" y="276.00" font-size="10" text-anchor="middle" font-weight="bold" fill="#000">A1</text><line x1="116.00" y1="268.00" x2="186.00" y2="268.00" stroke="#000" stroke-width="1.0" stroke-linecap="round"/><polygon points="186.00,268.00 180.52,270.45 180.52,265.55" fill="#000" fill-opacity="1" stroke="#000" stroke-width="0.6" stroke-linejoin="round"/><text x="150.00" y="284.00" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#000">count st and ridges</text><text x="14.00" y="210.00" font-size="9.5" text-anchor="start" font-weight="normal" fill="#333">Compare with the stacking table of the pattern.</text></g></svg>
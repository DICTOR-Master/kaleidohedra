<!doctype html><meta charset="utf-8"><title>O–H compound (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// The O–H compound (?show=compound|core|hull|both&px=): the Hecatodihedron (gold) and the Ogdoecontahedron (teal) interlocked in the truncated
// icosahedron's midsphere; their common core, the rectified truncated icosahedron (pentagons gold, hexagons teal, triangles wisteria); the hull,
// its dual (rhombi gold, the other quadrilaterals wisteria). Orthographic, bearing B of the P4 figures, house palette. Data: oh-render.json.
(async function () {
  const q = new URLSearchParams(location.search), show = q.get('show') || 'compound', PX = +(q.get('px') || 1200);
  const J = await fetch('oh-render.json').then((r) => r.json());
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(PX, PX); renderer.setPixelRatio(1);
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ea);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.85)); const sun = new THREE.DirectionalLight(0xffffff, 0.6); scene.add(sun);
  function add(S, col, opts = {}) {
    const pos = [], cols = [], line = [];
    S.f.forEach((f, k) => { const c = new THREE.Color(col(S.t[k]));
      for (let i = 1; i + 1 < f.length; i++) { pos.push(...S.v[f[0]], ...S.v[f[i]], ...S.v[f[i + 1]]); for (let j = 0; j < 3; j++) cols.push(c.r, c.g, c.b); }
      for (let i = 0; i < f.length; i++) line.push(...S.v[f[i]], ...S.v[f[(i + 1) % f.length]]); });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, flatShading: true, side: THREE.DoubleSide, transparent: !!opts.op, opacity: opts.op || 1, depthWrite: !opts.op, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(line, 3));
    scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x2a2218, transparent: !!opts.op, opacity: opts.op ? 0.5 : 1 })));
  }
  const GOLD = 0xe8b84a, TEAL = 0x4dd0e1, WIS = 0xc792ea, ORANGE = 0xff9a52;
  if (show === 'compound') { add(J.H, () => GOLD); add(J.O, () => TEAL); }
  if (show === 'core') add(J.core, (t) => (t === '5' ? GOLD : t === '6' ? TEAL : WIS));
  if (show === 'hull') add(J.hull, (t) => (t === '4r' ? GOLD : WIS));
  if (show === 'both') { add(J.core, (t) => (t === '5' ? GOLD : t === '6' ? TEAL : WIS)); add(J.hull, (t) => (t === '4r' ? 0xf3e2b5 : 0xe6d6f3), { op: 0.28 }); }
  const H = 2.05, dir = new THREE.Vector3(...J.view.dir), up = new THREE.Vector3(...J.view.up);
  const cam = new THREE.OrthographicCamera(-H, H, H, -H, 0.01, 200); cam.position.copy(dir.clone().multiplyScalar(40)); cam.up.copy(up); cam.lookAt(0, 0, 0);
  sun.position.copy(dir.clone().multiplyScalar(6).add(up.clone().multiplyScalar(5)).add(up.clone().cross(dir).multiplyScalar(-3)));
  renderer.render(scene, cam); document.title = 'ready';
})();
</script>

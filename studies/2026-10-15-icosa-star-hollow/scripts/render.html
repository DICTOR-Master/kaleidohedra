<!doctype html><meta charset="utf-8"><title>Cleo-Ico hold render (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}#tag{position:fixed;right:14px;bottom:10px;font:600 14px system-ui;color:#5b5346}#cap{position:fixed;left:14px;top:10px;font:600 15px system-ui;color:#3d372d}</style>
<div id="tag">DICTO · dictospheres.com</div><div id="cap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
  const scn = location.hash.slice(1) || 'closed';
  const J = await fetch('cleo_hold.json').then((r) => r.json());
  const W = 1000, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, W); renderer.setPixelRatio(1); renderer.localClippingEnabled = true; document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ea);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.8)); const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(4, 7, 5); scene.add(sun);
  const GOLD = 0xd9a441, VIOLET = 0x8e6cc8, GLASS = 0x6fa8c7;
  const cut = scn === 'cut' ? [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)] : [];
  function mesh(S, color, glass, shift = 0, clip = cut) {
    const c = S.c, n = Math.hypot(...c) || 1, d = c.map((x) => (x / n) * shift);
    const V = S.v.map((v) => [v[0] + d[0], v[1] + d[1], v[2] + d[2]]), pos = [];
    for (const f of S.f) for (const j of f) pos.push(...V[j]);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true, transparent: glass, opacity: glass ? 0.22 : 1,
      side: THREE.DoubleSide, depthWrite: !glass, clippingPlanes: clip })));
    const eg = new THREE.EdgesGeometry(g, 1); const lm = new THREE.LineBasicMaterial({ color: glass ? 0x2f5b73 : 0x3b2a10, clippingPlanes: clip });
    scene.add(new THREE.LineSegments(eg, lm));
  }
  const caps = { closed: 'Core (edge 1) held by 20 Cleo-Icos inside the glass icosidodecahedron', cut: 'Cut in half: each Cleo-Ico point on a face centre of the core',
    apart: 'Pulled apart along the 3-fold axes', bare: 'Core and the 20 Cleo-Icos, shell removed' };
  document.getElementById('cap').textContent = caps[scn] || '';
  const apart = scn === 'apart' ? 0.45 : 0;
  mesh(J.core, GOLD, false, 0, []);
  for (const C of J.cleo) mesh(C, VIOLET, false, apart);
  if (scn !== 'bare' && scn !== 'apart') mesh(J.shell, GLASS, true);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  cam.position.set(scn === 'cut' ? 0.9 : 3.2, scn === 'cut' ? 1.2 : 2.3, scn === 'cut' ? 6.2 : 4.6).multiplyScalar(scn === 'apart' ? 2.1 : 1.55); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam); document.title = 'ready';
})();
</script>

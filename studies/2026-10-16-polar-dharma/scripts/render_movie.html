<!doctype html><meta charset="utf-8"><title>Dharma movies (DICTO)</title>
<style>html,body{margin:0;background:#f4f1ea}canvas{display:block}#tag{position:fixed;right:14px;bottom:10px;font:600 15px system-ui;color:#5b5346}#cap{position:fixed;left:16px;bottom:10px;font:500 15px system-ui;color:#5b5346}</style>
<div id="tag">DICTO · dictospheres.com</div><div id="cap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Two loops, pure geometry (DICTO, 2026-10-16). ?toggle: the toggle sphere slides between its two exact settings; the flipped
// cycle is the true polar image at every frame (it scales by rho^2), shared stations turn dark only where they truly coincide.
// ?zoom: the camera falls by exactly phi^3 through one turn of the infinite core, so the last frame is the first.
// window.frame(t) draws the frame for t in [0, 1).
(async function () {
  const mode = location.search.includes('zoom') ? 'zoom' : 'toggle', PX = 960, P = (1 + Math.sqrt(5)) / 2;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(PX, PX); renderer.setPixelRatio(1); renderer.localClippingEnabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ea);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.85)); const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(4, 7, 5); scene.add(sun);
  const clip = [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)];
  const cam = new THREE.PerspectiveCamera(30, 1, 0.002, 200);
  const mesh = (S, col, opacity, solid) => {
    const pos = [], line = [];
    for (const f of S.f) { for (let i = 1; i + 1 < f.length; i++) pos.push(...S.v[f[0]], ...S.v[f[i]], ...S.v[f[i + 1]]); for (let i = 0; i < f.length; i++) line.push(...S.v[f[i]], ...S.v[f[(i + 1) % f.length]]); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
    const mf = new THREE.MeshStandardMaterial(solid ? { color: col, roughness: 0.5, flatShading: true, side: THREE.DoubleSide, clippingPlanes: clip, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }
                                                    : { color: col, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, flatShading: true, clippingPlanes: clip });
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(line, 3));
    const ml = new THREE.LineBasicMaterial({ color: solid ? 0x2a2218 : col, clippingPlanes: clip });
    const grp = new THREE.Group(); grp.add(new THREE.Mesh(g, mf), new THREE.LineSegments(lg, ml)); grp.userData = { mf, ml, col }; return grp;
  };
  if (mode === 'zoom') {
    const J = await fetch('polar-turns-render.json').then((r) => r.json());
    const COL = [0x4dd0e1, 0xc792ea, 0x5fd38a, 0xf08fc0, 0x9fd8ff, 0xff9a52, 0x9fa8da];
    const sh = (S) => { const c = S.c; return { v: S.v.map((p) => p.map((x, i) => c[i] + (x - c[i]) * 0.97)), f: S.f }; };
    J.layers.forEach((L, k) => { for (const S of L.pieces) scene.add(mesh(sh(S), COL[k % J.nlay], 1, true)); });
    scene.add(mesh(sh(J.core), 0xffc857, 1, true));
    const dir = new THREE.Vector3(0.12, 0.2, 1).normalize();
    window.frame = (t) => { const d = 2.5 / Math.pow(P, 3 * t); cam.position.copy(dir.clone().multiplyScalar(d)); cam.lookAt(0, 0, 0); renderer.render(scene, cam);
      document.getElementById('cap').textContent = 'The infinite core: one turn = ×φ³'; };
  } else {
    const J = await fetch('toggle-movie.json').then((r) => r.json());
    const warm = [0xffc857, 0xffb74d, 0xff9a52, 0xf08a5d, 0xe57373, 0xd4a017, 0xc0392b], cool = [0x4dd0e1, 0x29b6f6, 0x5c6bc0, 0x7e57c2, 0x26a69a, 0x0097a7, 0x3949ab];
    const world = new THREE.Group(); scene.add(world);
    const orig = J.orig.map((S, i) => { const m = mesh(S, warm[i], 0.1, false); m.userData.name = S.name; world.add(m); return m; });
    const flipG = new THREE.Group(); world.add(flipG);
    J.flip.forEach((S, i) => flipG.add(mesh(S, cool[i], 0.1, false)));
    const ink = new THREE.Color(0x1d1a16);
    // the loop: hold at the ends setting, slide to the middle setting (rho^2 x3), hold, slide back; ease in and out
    const ease = (x) => x * x * (3 - 2 * x);
    const u = (t) => t < 0.1 ? 0 : t < 0.45 ? ease((t - 0.1) / 0.35) : t < 0.55 ? 1 : t < 0.9 ? 1 - ease((t - 0.55) / 0.35) : 0;
    const axis = new THREE.Vector3(...J.orig[0].v[0]).normalize();   // an icosahedron corner: a five-fold axis
    window.frame = (t) => {
      const e = u(t), s = Math.pow(3, e); flipG.scale.setScalar(s);
      world.setRotationFromAxisAngle(axis, 2 * Math.PI / 5 * t);      // a fifth of a turn about a five-fold axis: the loop closes
      const wEnds = Math.max(0, 1 - e / 0.02), wMid = Math.max(0, 1 - (1 - e) / 0.02);
      for (const m of orig) {
        const w = J.shared_ends.includes(m.userData.name) ? wEnds : J.shared_middle.includes(m.userData.name) ? wMid : 0;
        const c = new THREE.Color(m.userData.col).lerp(ink, w); m.userData.ml.color.copy(c); m.userData.mf.color.copy(c); m.userData.mf.opacity = 0.1 + 0.15 * w;
      }
      const R = Math.max(2.49, 1.4013 * s); const dir = new THREE.Vector3(0.12, 0.2, 1).normalize();
      cam.position.copy(dir.multiplyScalar(R * 4.3)); cam.lookAt(0, 0, 0); renderer.render(scene, cam);
      document.getElementById('cap').textContent = e < 0.001 ? 'toggle ρ = φ/2: ends shared (I, D)' : e > 0.999 ? 'toggle ρ = φ√3/2: middle shared (ID, RT)' : 'toggle sliding: ρ² × ' + s.toFixed(3);
    };
  }
  window.frame(0); document.title = 'ready';
})();
</script>

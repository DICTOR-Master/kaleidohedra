<!DOCTYPE html>
<html lang="en" data-site="kaleidohedra">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- site head: build.mjs sets the icons for the site; defaults to Kaleidohedra's. -->
  <title>Kaleidohedra</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/kaleidohedra-icon-32.png" />
  <link rel="apple-touch-icon" href="./assets/brand/kaleidohedra-icon-180.png" />
  <!-- /site head -->
  <link rel="stylesheet" href="./src/app/tokens.css" />
  <style>
    html, body { margin: 0; background: #0a0c14; }
    body { padding: 24px 16px 64px; }
    .back { display: block; max-width: 760px; margin: 0 auto 20px; font: var(--text-m) var(--font-ui); color: var(--accent); }
  </style>
</head>
<body>
  <a class="back" href="./">&larr;</a>
  <main class="md-guide">Loading…</main>
  <script type="module">
    // Terms / Privacy / Security, rendered from the same .md files the
    // repo keeps (served at /terms, /privacy, /security via vercel.json).
    import { renderMarkdown, GUIDE_CSS } from './src/app/markdown.js';
    import { SITE, SITES } from './src/app/site.js';
    // One set of legal texts for the joined app; each front door shows its own name.
    const NAME = SITES[SITE].name;
    document.querySelector('.back').textContent = `← Open ${NAME}`;
    const DOCS = { terms: ['TERMS.md', 'Terms of Service'], privacy: ['PRIVACY.md', 'Privacy'], security: ['SECURITY.md', 'Security'] };
    // ?doc= when opened directly; the path itself (/privacy) behind the
    // vercel.json rewrite, where the browser never sees the query.
    const key = new URLSearchParams(location.search).get('doc') ?? location.pathname.replace(/^.*\//, '');
    const [file, title] = DOCS[key] ?? DOCS.terms;
    document.title = `${title} · ${NAME}`;
    const style = document.createElement('style');
    style.textContent = GUIDE_CSS;
    document.head.appendChild(style);
    const main = document.querySelector('main');
    fetch(`./${file}`)
      .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then((md) => { main.innerHTML = renderMarkdown(md.replaceAll('Kaleidohedra is', `${NAME} is`).replaceAll('Kaleidohedra has', `${NAME} has`)); })
      .catch(() => { main.textContent = 'This page could not be loaded. Check your connection and try again.'; });
  </script>
</body>
</html>

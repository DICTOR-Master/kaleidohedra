name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    # Math/logic tests and the apps' own checks. Since the shape browser joined DICTO (D4), the DICTO
    # screen's imports reach three (krp-core's face registration), so dependencies are installed.
    runs-on: ubuntu-latest
    timeout-minutes: 5 # normally ~1min -- a real hang should fail fast, not sit for GitHub's 360min default
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # krp-core, the shared geometry (src/krp-core)
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --test tests/unit/
      # Kaleidohedra and Rhombiverse are one app (KRP, 2026-10-08): both apps' own checks run here; the
      # shared geometry's (krp-core) run in its own repo.
      # The 160 target cells: rebuilt from their Gram matrices, each tiles space; TARGETS.md agrees.
      - run: node scripts/verify-targets.mjs
      - run: node scripts/verify-kaleidoscope.mjs
      - run: node scripts/verify-trajectory.mjs
      - run: node scripts/verify-construction.mjs
      - run: node scripts/verify-lattice-2d.mjs
      - run: node scripts/verify-dicto-hex.mjs
      - run: node scripts/verify-4d.mjs
      # Translations: every key in all 7 languages (the app's and Rhombis's).
      - run: node scripts/verify-i18n.mjs
      - run: node scripts/verify-rhombis-i18n.mjs
      # The repo's About text (outside the repo, so it drifts): warns only.
      - run: node scripts/verify-about.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  catalogue:
    # Every 5D/6D catalogue entry really occurs and lands, at 9 phason and
    # position probes (about 6 min on the Pi; its own job so the unit-test
    # job keeps its fast-fail limit).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # krp-core, the shared geometry (src/krp-core)
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/verify-catalogue.mjs

  browser-smoke-test:
    # Real-browser check (Playwright) -- the actual app, served exactly
    # as README.md's own local-dev instructions describe (plain
    # `python3 -m http.server` directly over raw src/, no build step),
    # driven the same way a real player would use it. build-check below
    # runs this exact same test again against the minified dist/ output
    # Vercel actually deploys -- this job is the dev-parity one.
    runs-on: ubuntu-latest
    # Normally ~1-5min end to end; this job has hung indefinitely on
    # GitHub's shared runners more than once (unrelated to app changes --
    # confirmed by two consecutive hangs on a commit smoke.mjs never
    # touches the code path of) -- fail fast instead of sitting
    # "in_progress" for hours against GitHub's 360min default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # krp-core, the shared geometry (src/krp-core)
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm install
          # GitHub runners sometimes hang in this download: give each try 5 minutes, up to 3 tries; a killed try leaves apt locked, so clear that first.
          for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "Playwright install hung or failed (try $i), clearing apt and retrying"; sudo pkill -9 -f "apt-get|dpkg" || true; sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock; sudo dpkg --configure -a || true; sleep 5; done
      - name: Serve app
        run: python3 -m http.server 8000 &
      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/index.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "server never came up" >&2
          exit 1
      - name: Run smoke test through both front doors
        working-directory: tests/browser
        run: |
          DOOR=kaleidohedra node smoke.mjs
          DOOR=rhombiverse node smoke.mjs

  build-check:
    # Verifies the ACTUAL production artifact (scripts/build.mjs's
    # minified dist/ -- what vercel.json's buildCommand produces and
    # Vercel actually deploys), not just that esbuild's minifier didn't
    # throw. Runs the exact same smoke test as browser-smoke-test above,
    # against dist/ instead of raw src/, so a minification-introduced
    # regression (unlikely, but esbuild does rename/reorder things) is
    # caught here, before a real deploy, not after.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # krp-core, the shared geometry (src/krp-core)
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install build deps
        run: npm install
      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm install
          # GitHub runners sometimes hang in this download: give each try 5 minutes, up to 3 tries; a killed try leaves apt locked, so clear that first.
          for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "Playwright install hung or failed (try $i), clearing apt and retrying"; sudo pkill -9 -f "apt-get|dpkg" || true; sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock; sudo dpkg --configure -a || true; sleep 5; done
      # Each front door's own build (SITE picks it, as each Vercel project does), smoke-tested.
      - name: Build and smoke-test each front door
        run: |
          for site in kaleidohedra rhombiverse; do
            SITE=$site npm run build
            (cd dist && python3 -m http.server 8000 >/dev/null 2>&1 &)
            for i in $(seq 1 20); do curl -sf http://localhost:8000/index.html > /dev/null && break; sleep 0.5; done
            grep -q "data-site=\"$site\"" dist/index.html
            (cd tests/browser && DOOR=$site node smoke.mjs)
            pkill -f "http.server 8000" || true
            sleep 1
          done
      # Stale-wording guard (scripts/verify-copy.mjs): fails if retired
      # world-building/game terms reach any user-visible text again.
      - name: Check user-visible text for stale terms
        run: npm run verify:copy
